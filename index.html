<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SLP Session Tracker</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1a1a1a; --muted: #666; --line: #d8d8d8;
    --accent: #2b6cb0; --warn: #b7791f; --danger: #c53030; --ok: #2f855a;
    --field: #ffffff; --row: #fafafa;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  #app { max-width: 1100px; margin: 0 auto; padding: 0 16px 64px; }

  header.app-header {
    position: sticky; top: 0; z-index: 10; background: var(--bg);
    border-bottom: 1px solid var(--line); padding: 10px 0 0;
  }
  .app-title { font-size: 15px; font-weight: 600; margin: 0 0 8px; }
  .app-version {
    margin: 32px 0 0; padding-top: 12px; border-top: 1px solid var(--line);
    color: var(--muted); font-size: 12px; text-align: right;
  }
  .tabs { display: flex; gap: 4px; }
  .tab {
    appearance: none; border: 1px solid var(--line); border-bottom: none;
    background: var(--row); color: var(--muted); cursor: pointer;
    padding: 7px 16px; border-radius: 6px 6px 0 0; font: inherit;
  }
  .tab.active { background: var(--bg); color: var(--fg); font-weight: 600;
                box-shadow: inset 0 2px 0 var(--accent); }
  .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .view { padding-top: 18px; }
  .muted { color: var(--muted); }
  .empty { color: var(--muted); padding: 28px 0; }
  .toast {
    position: fixed; right: 16px; bottom: 16px; z-index: 50;
    padding: 9px 14px; border-radius: 6px; border: 1px solid var(--line);
    background: var(--bg); box-shadow: 0 2px 10px rgba(0,0,0,.12);
  }
  .toast-ok { border-color: var(--ok); color: var(--ok); }
  .toast-warn { border-color: var(--warn); color: var(--warn); }
  .toast-error { border-color: var(--danger); color: var(--danger); }
  button.primary {
    background: var(--accent); color: #fff; border: 1px solid var(--accent);
    border-radius: 6px; padding: 7px 14px; font: inherit; cursor: pointer;
  }
  button.plain {
    background: var(--bg); color: var(--fg); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 12px; font: inherit; cursor: pointer;
  }
  input[type="text"], input[type="number"], input[type="time"], textarea, select {
    font: inherit; color: var(--fg); background: var(--field);
    border: 1px solid var(--line); border-radius: 5px; padding: 5px 7px;
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .panel { border: 1px solid var(--line); border-radius: 8px; padding: 14px; margin-bottom: 22px; }
  .panel h2 { font-size: 14px; margin: 0 0 10px; text-transform: uppercase;
              letter-spacing: .04em; color: var(--muted); }
  .row-form { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .student-row { display: flex; gap: 10px; align-items: center; padding: 5px 0;
                 border-bottom: 1px solid var(--line); }
  .student-row:last-child { border-bottom: none; }
  .student-row .grow { flex: 1; }
  .week { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .day-column { border: 1px solid var(--line); border-radius: 8px; padding: 8px; min-height: 120px; }
  .day-name { font-weight: 600; font-size: 13px; margin-bottom: 8px; }
  .slot-card { border: 1px solid var(--line); border-radius: 6px; padding: 7px;
               margin-bottom: 7px; background: var(--row); }
  .slot-time { font-weight: 600; font-size: 13px; }
  .slot-roster { font-size: 13px; color: var(--muted); }
  .slot-student { display: inline-flex; gap: 5px; align-items: center; margin-right: 10px; }
  .linkish { background: none; border: none; color: var(--accent); cursor: pointer;
             font: inherit; padding: 0; text-decoration: underline; }
  .danger-link { color: var(--danger); }

  .split { display: grid; grid-template-columns: 250px 1fr; gap: 20px; align-items: start; }
  /* Search and grade share a row; the school select takes its own so long school names
     stay readable — a truncated one can't be told apart from a near-identical typo. */
  .student-filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  /* Full width so it reads as an action on the list below it, not a third filter. */
  #add-student-toggle { width: 100%; margin-bottom: 8px; text-align: left; }
  /* The heading and its Edit button share a baseline; the controls wrap on a narrow pane
     rather than pushing Save off the edge. */
  .detail-heading { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .detail-heading h2 { margin: 0; }
  /* Set apart from the goals above it: this is the one control in the pane that undoes
     a year of setup, and it should not read as part of the last goal block. */
  .remove-block { margin-top: 28px; border-top: 1px solid var(--line); }
  .student-filters .search-filter { flex: 1; min-width: 0; }
  /* Both min-width:0 and max-width:100% are here to stop the select claiming its longest
     option's width and overflowing the 250px column onto the detail pane. Measured 2026-08-25:
     either one alone is enough today (drop both and the select goes 526px wide in a 250px
     column), so neither can be removed on the grounds that the other is doing the work —
     that reasoning deletes the first and then the second. The closed label ellipsises, but
     the open list still shows every school in full, which is where a typo is spotted.
     Scoped by class, not id, so BOTH lists are covered — the caseload panel is wider and
     does not overflow today, but "wide enough right now" is how this got in the first
     time, and the widest school name is her data, not ours. shell.test.js measures it. */
  .student-filters .school-filter { flex-basis: 100%; min-width: 0; max-width: 100%; }
  .goal-block { border: 1px solid var(--line); border-radius: 8px; padding: 12px;
                margin-bottom: 16px; }
  .goal-text { font-size: 14px; margin: 0 0 8px; }
  .goal-edit { width: 100%; min-height: 62px; resize: vertical; }
  .objective-block { border-left: 3px solid var(--accent); padding: 8px 0 8px 12px;
                     margin: 12px 0 12px 6px; }
  .objective-text { font-size: 14px; margin: 0 0 8px; }
  .field-row { display: flex; gap: 8px; align-items: center; padding: 3px 0; }
  .field-label { flex: 1; min-width: 120px; }
  .field-default { width: 70px; }
  .field-role { font-size: 12px; color: var(--muted); min-width: 62px; }
  .clamp { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical;
           overflow: hidden; cursor: pointer; }
  .clamp.open { -webkit-line-clamp: unset; }

  .day-bar { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; }
  .day-bar .grow { flex: 1; }
  #date-label { font-size: 17px; font-weight: 600; }
  #charted-count { color: var(--muted); font-variant-numeric: tabular-nums; }
  .slot-section { border: 1px solid var(--line); border-radius: 8px; margin-bottom: 18px; }
  .slot-head { display: flex; gap: 10px; align-items: center; padding: 9px 12px;
               background: var(--row); border-bottom: 1px solid var(--line);
               border-radius: 8px 8px 0 0; font-weight: 600; }
  .student-block { padding: 11px 12px; border-bottom: 1px solid var(--line); }
  .student-block:last-child { border-bottom: none; }
  .student-block.is-absent .objective-row { opacity: .4; }
  .student-head { display: flex; gap: 9px; align-items: baseline; }
  /* Wider than it looks: the hit area has to survive a fingertip on a laptop
     trackpad between sessions, so it is padded well past the glyph. */
  .disclosure { background: none; border: none; color: var(--muted); cursor: pointer;
                font-size: 12px; line-height: 1; padding: 4px 6px; margin-left: -6px; }
  .disclosure:hover { color: var(--fg); }
  .student-charted { font-size: 12px; color: var(--muted); }
  .student-name { font-weight: 600; }
  .state-chip { font-size: 12px; padding: 1px 8px; border-radius: 999px;
                border: 1px solid var(--line); color: var(--muted); }
  .state-chip[data-state="present"] { color: var(--ok); border-color: var(--ok); }
  .state-chip[data-state="absent"] { color: var(--danger); border-color: var(--danger); }
  .added-chip { font-size: 12px; padding: 1px 8px; border-radius: 999px;
                border: 1px solid var(--accent); color: var(--accent); }
  .goal-line { font-size: 13px; color: var(--muted); margin: 5px 0 8px; }

  /* The layout rule from spec §5: text never pushes the inputs out of column. */
  .objective-row { display: grid; grid-template-columns: minmax(0, 1fr) 340px;
                   gap: 14px; align-items: start; padding: 5px 0; }
  .objective-label { font-size: 13px; min-width: 0; }
  .objective-inputs { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; }
  .value-field { display: flex; flex-direction: column; gap: 2px; }
  .value-field .cap { font-size: 11px; color: var(--muted); }
  .value-input[data-type="number"] { width: 66px; }
  .value-input[data-type="text"] { width: 210px; }
  .value-input[data-entered="false"] { color: var(--muted); font-style: italic; }
  .ratio { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .note-input { width: 100%; min-height: 42px; margin-top: 6px; resize: vertical; }
  @media (max-width: 820px) { .objective-row { grid-template-columns: 1fr; } }

  .history-row { border-bottom: 1px solid var(--line); padding: 8px 0; font-size: 14px; }
  .history-row:last-child { border-bottom: none; }
  .history-date { font-weight: 600; }
  .history-data { color: var(--muted); font-size: 13px; }
  .history-note { margin: 3px 0 0; }
  .objective-chart { margin: 14px 0; }
  .objective-chart svg { display: block; max-width: 100%; height: auto;
                         border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
  .chart-line { fill: none; stroke: var(--accent); stroke-width: 2; }
  .chart-point { fill: var(--accent); }
  .chart-axis { stroke: var(--line); stroke-width: 1; }
  .chart-tick { fill: var(--muted); font-size: 10px; }
  /* The 100% goal line. It used to be the top edge of the chart; now that the ceiling
     rises to fit a score above criterion, this is what carries "met the goal". */
  .chart-criterion { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 4 3; }
  .mastery { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .mastery.met { color: var(--ok); font-weight: 600; }

  #backup-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
                padding-bottom: 8px; font-size: 13px; }
  #backup-status { color: var(--muted); flex: 1 1 auto; min-width: 0; }
  button.linklike { background: none; border: 0; padding: 0; font: inherit;
                    color: var(--accent); text-decoration: underline; cursor: pointer; }
  button.linklike:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #backup-more { flex: 0 0 auto; text-decoration: none; }
  #backup-more-panel { display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
                       padding: 8px 11px; margin-bottom: 10px; font-size: 13px;
                       background: var(--row); border-radius: 6px; }
  button.danger { background: var(--danger); color: #fff; border: 1px solid var(--danger);
                  border-radius: 6px; padding: 6px 12px; font: inherit; cursor: pointer; }
  button.danger:disabled { opacity: 0.45; cursor: not-allowed; }
  #restore-confirm, #start-fresh-confirm {
                     border: 1px solid var(--danger); border-radius: 6px;
                     padding: 12px 14px; margin-bottom: 10px; font-size: 13px;
                     background: #fffafa; }
  .confirm-title { font-weight: 600; font-size: 14px; margin: 0 0 8px; }
  .confirm-line { margin: 2px 0; font-variant-numeric: tabular-nums; }
  .confirm-note { margin: 8px 0 2px; color: var(--muted); }
  .confirm-warn { margin: 8px 0 2px; color: var(--danger); font-weight: 600; }
  #restore-confirm-phrase, #start-fresh-phrase {
                           font: inherit; padding: 5px 8px; margin-top: 4px;
                            border: 1px solid var(--danger); border-radius: 5px; }
  .confirm-actions { display: flex; gap: 8px; align-items: center; margin-top: 12px; }
  #backup-nag { background: #fffaf0; border: 1px solid var(--warn); color: var(--warn);
                border-radius: 6px; padding: 7px 11px; margin-bottom: 10px; font-size: 13px; }

  /* --- the attendance grid --- */
  /* The table is the only horizontally scrolling thing on the page: #app is capped
     at 1100px and a quarter is sixty columns wide. The document keeps scrolling
     vertically, which is what the scroll-position fix in doRender() depends on. */
  .att-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
  .att-grid { border-collapse: separate; border-spacing: 0; font-size: 13px; }
  .att-grid th, .att-grid td {
    padding: 3px 5px; text-align: center; white-space: nowrap;
    border-bottom: 1px solid var(--line); background: var(--bg);
  }
  .att-grid thead th { font-weight: 600; color: var(--muted); font-size: 11px; }
  .att-grid tbody tr:nth-child(even) th,
  .att-grid tbody tr:nth-child(even) td { background: var(--row); }
  /* Sticky in three places: her name on the left, and the two answers on the right.
     Set to a quarter she does not scroll at all — these columns are the whole point. */
  .att-grid .att-name { position: sticky; left: 0; z-index: 2; text-align: left;
                        min-width: 130px; font-weight: 400; }
  /* 150px does not fit "78% · 7 of 9 · 3 uncharted" at 13px, and this column is
     nowrap and sticky, so the overflow lands under the Owed column rather than
     wrapping. Sized to the longest real string; confirm it in the screenshot pass. */
  .att-grid .att-pct  { position: sticky; right: 96px; z-index: 2; text-align: right;
                        min-width: 210px; border-left: 1px solid var(--line); }
  .att-grid .att-owed { position: sticky; right: 0; z-index: 2; text-align: right;
                        min-width: 96px; }
  .att-grid thead .att-name, .att-grid thead .att-pct, .att-grid thead .att-owed { z-index: 3; }
  /* A percentage computed over an incomplete quarter is provisional (spec:174-175).
     The uncharted count says so in words; this says so at a glance. Not scoped to
     .att-grid: the student detail page's #student-attendance-pct carries this class
     too, and needs the same look for the same reason — she reads it at a glance onto
     the note she is writing right there. */
  .att-pct-provisional { font-style: italic; color: var(--muted); }
  /* The month band above the day numbers. Ruled off so the runs read as groups. */
  .att-grid thead .att-month { border-bottom: 1px solid var(--line);
                               border-left: 1px solid var(--line);
                               font-size: 11px; letter-spacing: .3px; }
  .att-cell { border: 0; background: none; padding: 0 3px; cursor: pointer;
              font: inherit; line-height: 1.2; color: var(--muted); }
  .att-cell[data-state="present"]   { color: var(--ok); }
  .att-cell[data-state="absent"]    { color: var(--danger); }
  .att-cell[data-state="missed"]    { color: var(--warn); font-weight: 700; }
  .att-cell[data-state="cancelled"] { color: var(--muted); }
  .att-cell sup { font-size: 9px; letter-spacing: .5px; }
  .att-none { color: var(--line); }
  .att-owed-debt { color: var(--warn); }
  .att-legend { font-size: 12px; color: var(--muted); margin: 10px 0 0;
                display: flex; flex-wrap: wrap; gap: 12px; }
  /* In-flow, not absolute: it lives in its own row right after the one she clicked
     (gridTable), so it needs to take real space and push the rows below it down —
     an out-of-flow box would collapse its row to nothing and land who knows where. */
  .att-popover { display: inline-block; text-align: left; background: var(--bg);
                 border: 1px solid var(--line); border-radius: 8px; padding: 8px;
                 box-shadow: 0 4px 14px rgba(0,0,0,.12); min-width: 190px; }
  .att-popover-row td { padding: 8px 5px; }
  .att-popover h3 { font-size: 11px; margin: 0 0 6px; text-transform: uppercase;
                    letter-spacing: .5px; color: var(--muted); font-weight: 600; }
  .att-popover .att-choices { display: flex; flex-direction: column; gap: 2px; }
  .att-popover button { text-align: left; }
  .att-popover hr { border: 0; border-top: 1px solid var(--line); margin: 8px 0 6px; }
</style>
</head>
<body>
<div id="app"></div>
<script>
// ============================================================
// SLP Session Tracker — one file, no build step, no network.
// Sections below are ordered by dependency; each only uses those above it.
// ============================================================
window.SLP = { version: '1.7.0' };

// ============================================================
// SECTION: db — IndexedDB access. Knows stores, not meaning.
// ============================================================
SLP.db = (() => {
  const DB_NAME = 'slp-tracker';
  const DB_VERSION = 1;

  // store name -> index definitions
  const SCHEMA = {
    students:   [],
    goals:      ['studentId'],
    objectives: ['goalId'],
    slots:      ['dayOfWeek'],
    sessions:   ['date', 'slotId'],
    attendance: ['sessionId', 'studentId'],
    notes:      ['sessionId', 'studentId'],
    datapoints: ['sessionId', 'studentId', 'objectiveId'],
    meta:       [],
  };
  const STORES = Object.keys(SCHEMA);

  let dbPromise = null;

  function open() {
    if (dbPromise) return dbPromise;
    dbPromise = new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = () => {
        const db = req.result;
        for (const [name, indexes] of Object.entries(SCHEMA)) {
          const os = db.objectStoreNames.contains(name)
            ? req.transaction.objectStore(name)
            : db.createObjectStore(name, { keyPath: 'id' });
          for (const idx of indexes) {
            if (!os.indexNames.contains(idx)) os.createIndex(idx, idx, { unique: false });
          }
        }
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
      req.onblocked = () => reject(new Error('IndexedDB upgrade blocked by another tab'));
    });
    return dbPromise;
  }

  // Wraps one transaction; resolves with `result` once the transaction commits,
  // so callers never read a value that failed to persist.
  async function tx(storeNames, mode, fn) {
    const db = await open();
    return new Promise((resolve, reject) => {
      const t = db.transaction(storeNames, mode);
      let result;
      t.oncomplete = () => resolve(result);
      t.onerror = () => reject(t.error);
      t.onabort = () => reject(t.error || new Error('transaction aborted'));
      result = fn(t);
      if (result && typeof result.then === 'function') {
        reject(new Error('transaction callbacks must be synchronous'));
      }
    });
  }

  return {
    STORES,
    open,

    async put(store, obj) {
      await tx(store, 'readwrite', t => { t.objectStore(store).put(obj); });
      return obj;
    },

    async get(store, id) {
      const box = { value: undefined };
      await tx(store, 'readonly', t => {
        const r = t.objectStore(store).get(id);
        r.onsuccess = () => { box.value = r.result; };
      });
      return box.value;
    },

    async getAll(store) {
      const box = { value: [] };
      await tx(store, 'readonly', t => {
        const r = t.objectStore(store).getAll();
        r.onsuccess = () => { box.value = r.result || []; };
      });
      return box.value;
    },

    async getAllBy(store, indexName, value) {
      const box = { value: [] };
      await tx(store, 'readonly', t => {
        const r = t.objectStore(store).index(indexName).getAll(value);
        r.onsuccess = () => { box.value = r.result || []; };
      });
      return box.value;
    },

    async del(store, id) {
      await tx(store, 'readwrite', t => { t.objectStore(store).delete(id); });
    },

    async bulkPut(store, objs) {
      await tx(store, 'readwrite', t => {
        const os = t.objectStore(store);
        for (const o of objs) os.put(o);
      });
    },

    async clearAll() {
      await tx(STORES, 'readwrite', t => {
        for (const s of STORES) t.objectStore(s).clear();
      });
    },
  };
})();

// ============================================================
// SECTION: model — entity shapes and the entered-vs-pre-filled rule.
// Pure functions only. No IO, no DOM, no await.
// ============================================================
SLP.model = (() => {
  let counter = 0;
  const uid = prefix =>
    prefix + '_' + Date.now().toString(36) + (counter++).toString(36) +
    Math.random().toString(36).slice(2, 7);
  const now = () => new Date().toISOString();

  // One field carries the outcome, so the vocabulary lives in one place.
  // `null` is legal too and is deliberately NOT in this list: it means a makeup
  // that is booked but not yet held — the row exists to carry isMakeup, and the
  // outcome has not happened. Listing it would invite `status ?? 'unmarked'`
  // arithmetic; keeping it out forces every reader to handle "no answer yet".
  const ATTENDANCE_STATUSES = Object.freeze(['present', 'absent', 'missed', 'cancelled']);

  const field = ({ label, type = 'number', default: def = null, role = null }) => ({
    id: uid('f'), label, type, default: type === 'number' ? def : null, role,
  });

  // The preset carries the semantics: role pairing is what makes a ratio derivable.
  const presetTrials = () => [
    field({ label: 'Trials completed', type: 'number', default: null, role: 'achieved' }),
    field({ label: 'Trials # goal', type: 'number', default: 4, role: 'target' }),
    field({ label: 'Notes', type: 'text' }),
  ];

  function seedValues(objective) {
    const values = {};
    for (const f of objective.fields) {
      values[f.id] = {
        value: f.type === 'number' ? (f.default === undefined ? null : f.default) : '',
        entered: false,   // a pre-filled default is NOT data entry
      };
    }
    return values;
  }

  function defaultFor(f) {
    return f.type === 'number' ? (f.default === undefined ? null : f.default) : '';
  }

  // The one rule the whole app leans on. `raw` is always what the input element holds.
  function setValue(dp, objective, fieldId, raw) {
    const f = objective.fields.find(x => x.id === fieldId);
    if (!f) return dp;
    const cell = dp.values[fieldId] || (dp.values[fieldId] = { value: defaultFor(f), entered: false });
    const str = raw == null ? '' : String(raw);

    if (str.trim() === '') {
      // Cleared: fall back to the pre-filled default and stop counting as an observation.
      cell.value = defaultFor(f);
      cell.entered = false;
      return dp;
    }
    if (f.type === 'number') {
      const n = Number(str);
      if (!Number.isFinite(n)) return dp;   // reject garbage, change nothing
      cell.value = n;
      cell.entered = true;                  // typing the default value is still an observation
      return dp;
    }
    cell.value = str;
    cell.entered = true;
    return dp;
  }

  const hasEnteredData = dp =>
    !!dp && Object.values(dp.values || {}).some(c => c.entered === true);

  function ratio(objective, dp) {
    const a = objective.fields.filter(f => f.role === 'achieved');
    const t = objective.fields.filter(f => f.role === 'target');
    if (a.length !== 1 || t.length !== 1) return null;
    const av = dp.values[a[0].id], tv = dp.values[t[0].id];
    if (!av || !tv) return null;
    if (!av.entered) return null;                  // a pre-filled target alone measures nothing
    if (typeof av.value !== 'number' || typeof tv.value !== 'number') return null;
    if (!tv.value) return null;                    // never divide by zero
    return { achieved: av.value, target: tv.value,
             pct: Math.round((av.value / tv.value) * 100) };
  }

  const displayText = (text, studentName) =>
    String(text || '').split('STUDENT').join(studentName || 'STUDENT');

  // The stored value is the plain number so grades stay sortable and records written
  // before this list existed still read correctly; the ordinal lives only in the label.
  // Pre-K and kindergarten carry no "grade" word — "grade Pre-K" is not how anyone says it.
  const ORDINALS = ['1st', '2nd', '3rd', '4th', '5th', '6th',
                    '7th', '8th', '9th', '10th', '11th', '12th'];
  const GRADES = Object.freeze([
    Object.freeze({ value: 'PK', label: 'Pre-K' }),
    Object.freeze({ value: 'K', label: 'Kindergarten' }),
    ...ORDINALS.map((ord, i) => Object.freeze({ value: String(i + 1), label: ord + ' grade' })),
  ]);

  // An unrecognised grade shows itself rather than vanishing — a record is never
  // silently emptied on screen just because its value is off the list.
  function gradeLabel(value) {
    if (!value) return '';
    const found = GRADES.find(g => g.value === String(value));
    return found ? found.label : String(value);
  }

  return {
    uid, now, field, presetTrials, seedValues, setValue, hasEnteredData, ratio, displayText,
    GRADES, gradeLabel, ATTENDANCE_STATUSES,

    student: ({ name, grade = '', school = '', background = '' }) => ({
      id: uid('s'), name, grade, school, background,
      active: true, createdAt: now(), updatedAt: now(),
    }),
    goal: ({ studentId, text, order = 0 }) => ({
      id: uid('g'), studentId, text, order, createdAt: now(), updatedAt: now(),
    }),
    objective: ({ goalId, text, order = 0, fields = presetTrials() }) => ({
      id: uid('o'), goalId, text, order, fields, createdAt: now(), updatedAt: now(),
    }),
    slot: ({ dayOfWeek, startTime, endTime, studentIds = [], location = '' }) => ({
      id: uid('sl'), dayOfWeek, startTime, endTime, studentIds, location, createdAt: now(),
    }),
    session: ({ date, slotId = null, startTime, endTime, location = '', roster = [] }) => ({
      id: uid('se'), date, slotId, startTime, endTime, location, roster, createdAt: now(),
    }),
    attendance: ({ sessionId, studentId, status, participation = 'scheduled', isMakeup = false }) => {
      if (status !== null && !ATTENDANCE_STATUSES.includes(status)) {
        throw new Error('unknown attendance status: ' + status);
      }
      return { id: uid('at'), sessionId, studentId, status, participation, isMakeup,
               updatedAt: now() };
    },
    note: ({ sessionId, studentId, text = '' }) => ({
      id: uid('n'), sessionId, studentId, text, updatedAt: now(),
    }),
    datapoint: ({ sessionId, studentId, objective }) => ({
      id: uid('dp'), sessionId, studentId, objectiveId: objective.id,
      values: seedValues(objective), updatedAt: now(),
    }),
  };
})();

// ============================================================
// SECTION: store — repositories and write paths.
// Sessions materialize on write, never on read.
// ============================================================
SLP.store = (() => {
  const db = SLP.db, m = SLP.model;
  const byName = (a, b) => a.name.localeCompare(b.name);

  // 'YYYY-MM-DD' -> 0..6, parsed as a local date so it never shifts a day by timezone.
  function dayOfWeek(dateStr) {
    const [y, mo, d] = dateStr.split('-').map(Number);
    return new Date(y, mo - 1, d).getDay();
  }

  // A slotless session has no template to be found by, so there is no honest answer
  // here — `find(s => s.slotId === null)` would return whichever ad-hoc session on this
  // date happens to be first. Ad-hoc sessions are addressed by their own id instead.
  async function findSession(dateStr, slotId) {
    if (!slotId) return null;
    const onDate = await db.getAllBy('sessions', 'date', dateStr);
    return onDate.find(s => s.slotId === slotId) || null;
  }

  async function ensureSession(dateStr, slot) {
    // An ad-hoc session is addressed by id. planForDate puts it on the synthetic slot
    // it builds, and bookMakeup returns it; there is nothing to create here, because a
    // session with no slot cannot be conjured from a date the way a recurring one can.
    if (!slot.id) {
      if (!slot.sessionId) throw new Error('an ad-hoc session must be addressed by sessionId');
      const adHoc = await db.get('sessions', slot.sessionId);
      if (!adHoc) throw new Error('unknown session: ' + slot.sessionId);
      return adHoc;
    }
    const existing = await findSession(dateStr, slot.id);
    if (existing) return existing;
    const session = m.session({
      date: dateStr, slotId: slot.id, startTime: slot.startTime,
      endTime: slot.endTime, location: slot.location,
      roster: [...slot.studentIds],       // snapshot, not a reference
    });
    await db.put('sessions', session);
    return session;
  }

  async function rowFor(store, sessionId, studentId) {
    const rows = await db.getAllBy(store, 'sessionId', sessionId);
    return rows.find(r => r.studentId === studentId) || null;
  }

  // Attendance derives from data entry, but never overrides an explicit mark.
  async function deriveAttendance(session, studentId) {
    const existing = await rowFor('attendance', session.id, studentId);
    // A status she chose is hers and is left alone. A null one is not a choice —
    // it is a makeup she booked and has not held yet, so data entry may fill it in.
    if (existing && existing.status && existing.status !== 'present') return existing;

    const dps = (await db.getAllBy('datapoints', 'sessionId', session.id))
      .filter(d => d.studentId === studentId);
    const note = await rowFor('notes', session.id, studentId);
    const touched = dps.some(m.hasEnteredData) || !!(note && note.text.trim());

    if (touched) {
      const row = existing || m.attendance({
        sessionId: session.id, studentId, status: 'present',
        participation: session.roster.includes(studentId) ? 'scheduled' : 'added',
      });
      row.status = 'present';
      row.updatedAt = m.now();
      await db.put('attendance', row);
      return row;
    }
    // Nothing entered any more — withdraw a mark the app itself derived.
    // But a booked makeup is not a derived mark: she scheduled it. Clearing a note
    // undoes the charting, not the appointment, so the row survives with its status
    // reset to null — back to "makeup booked, unmarked". Deleting it here destroyed
    // the booking: the credit vanished, the debt silently returned, and the row could
    // no longer be cancelled from the grid, since that control is gated on isMakeup.
    // Cancelling a makeup stays a deliberate act through the grid's delete control.
    // See docs/adr/0002-clearing-a-note-keeps-the-makeup-booking.md.
    if (existing && existing.isMakeup) {
      existing.status = null;
      existing.updatedAt = m.now();
      await db.put('attendance', existing);
      return existing;
    }
    if (existing) await db.del('attendance', existing.id);
    return null;
  }

  return {
    // --- caseload ---
    async listStudents({ activeOnly = false } = {}) {
      const all = await db.getAll('students');
      return all.filter(s => !activeOnly || s.active).sort(byName);
    },
    saveStudent: s => db.put('students', Object.assign(s, { updatedAt: m.now() })),
    async setStudentActive(id, active) {
      const s = await db.get('students', id);
      if (!s) return null;
      s.active = active; s.updatedAt = m.now();
      return db.put('students', s);
    },
    // A typo'd school would otherwise sit in her dropdown forever, so the two fields
    // she picks from a list are the two she can correct. Everything else is untouched.
    async updateStudentDetails(id, { grade, school }) {
      const s = await db.get('students', id);
      if (!s) return null;
      if (grade !== undefined) s.grade = grade;
      if (school !== undefined) s.school = school;
      s.updatedAt = m.now();
      return db.put('students', s);
    },

    // --- goals and objectives ---
    async goalsFor(studentId) {
      return (await db.getAllBy('goals', 'studentId', studentId))
        .sort((a, b) => a.order - b.order);
    },
    async objectivesFor(goalId) {
      return (await db.getAllBy('objectives', 'goalId', goalId))
        .sort((a, b) => a.order - b.order);
    },
    async objectivesForStudent(studentId) {
      const goals = await this.goalsFor(studentId);
      const out = [];
      for (const goal of goals) out.push({ goal, objectives: await this.objectivesFor(goal.id) });
      return out;
    },
    saveGoal: g => db.put('goals', Object.assign(g, { updatedAt: m.now() })),
    saveObjective: o => db.put('objectives', Object.assign(o, { updatedAt: m.now() })),
    // An objective owns the data charted against it; a goal owns its objectives.
    // Deleting a parent without its children leaves rows nothing can ever read
    // again — off the screen, but still in every backup she makes afterwards.
    async deleteObjective(id) {
      for (const dp of await db.getAllBy('datapoints', 'objectiveId', id)) {
        await db.del('datapoints', dp.id);
      }
      await db.del('objectives', id);
    },
    // What the confirmation has to say out loud. Sessions are counted distinct:
    // two objectives charted on the same day cost her one session, not two.
    async goalStakes(id) {
      const objectives = await db.getAllBy('objectives', 'goalId', id);
      const sessions = new Set();
      for (const o of objectives) {
        for (const dp of await db.getAllBy('datapoints', 'objectiveId', o.id)) {
          sessions.add(dp.sessionId);
        }
      }
      return { objectives: objectives.length, sessions: sessions.size };
    },
    async deleteGoal(id) {
      for (const o of await db.getAllBy('objectives', 'goalId', id)) {
        await this.deleteObjective(o.id);
      }
      await db.del('goals', id);
    },

    // --- schedule ---
    async listSlots() {
      return (await db.getAll('slots')).sort(
        (a, b) => a.dayOfWeek - b.dayOfWeek || a.startTime.localeCompare(b.startTime));
    },
    saveSlot: sl => db.put('slots', sl),

    // Deleting a slot removes the template, never the history charted against it — that
    // is what the toast promises. But a session left pointing at a slot that no longer
    // exists belongs to nothing: planForDate folds in ad-hoc sessions with `!s.slotId`,
    // so a dangling slotId made the session vanish from the day it was charted on while
    // its note survived, read-only, on the student page. That is the trap behind her
    // "delete the slot and recreate it" workaround, and why she ends up retyping notes.
    //
    // A session whose slot is gone genuinely has no template any more, so say so: the
    // slotId goes to null and it renders from its own time, roster and location
    // snapshot, exactly as a one-off session does.
    async deleteSlot(id) {
      for (const session of await db.getAllBy('sessions', 'slotId', id)) {
        session.slotId = null;
        await db.put('sessions', session);
      }
      await db.del('slots', id);
    },

    ensureSession,

    // --- the day view ---
    // Read-only. Materializes nothing, so browsing a future day keeps tracking the template.
    async planForDate(dateStr) {
      const dow = dayOfWeek(dateStr);
      const slots = (await this.listSlots()).filter(s => s.dayOfWeek === dow);
      const students = await db.getAll('students');
      const byId = Object.fromEntries(students.map(s => [s.id, s]));
      const adHoc = (await db.getAllBy('sessions', 'date', dateStr)).filter(s => !s.slotId);
      const entries = [];

      const build = async (slot, session) => {
        const roster = session ? session.roster : slot.studentIds;
        const entry = {
          slot, session,
          students: roster.map(id => byId[id]).filter(Boolean).sort(byName),
          attendance: {}, notes: {}, datapoints: {}, objectives: {},
        };
        if (session) {
          for (const a of await db.getAllBy('attendance', 'sessionId', session.id)) {
            entry.attendance[a.studentId] = a;
          }
          for (const n of await db.getAllBy('notes', 'sessionId', session.id)) {
            entry.notes[n.studentId] = n;
          }
          for (const d of await db.getAllBy('datapoints', 'sessionId', session.id)) {
            (entry.datapoints[d.studentId] || (entry.datapoints[d.studentId] = {}))[d.objectiveId] = d;
          }
        }
        for (const s of entry.students) {
          entry.objectives[s.id] = await this.objectivesForStudent(s.id);
        }
        return entry;
      };

      for (const slot of slots) entries.push(await build(slot, await findSession(dateStr, slot.id)));
      for (const session of adHoc) {
        entries.push(await build(
          { id: null, sessionId: session.id, dayOfWeek: dow, startTime: session.startTime,
            endTime: session.endTime, studentIds: session.roster, location: session.location },
          session));
      }
      return entries.sort((a, b) => a.slot.startTime.localeCompare(b.slot.startTime));
    },

    // --- the grid ---
    // All the IO in one place, and none of the meaning. A month is roughly 30 students
    // × 22 days and a quarter closer to 30 × 60; querying per session, per store the way
    // planForDate does would be hundreds of round-trips at that size. Four bulk reads
    // instead, whatever the range. Everything computed lives in derive.attendanceGrid.
    async attendanceRange({ from, to, today = null }) {
      const students = await this.listStudents({ activeOnly: true });
      const slots = await this.listSlots();
      const sessions = (await db.getAll('sessions'))
        .filter(s => s.date >= from && s.date <= to);
      const ids = new Set(sessions.map(s => s.id));
      // Filtered here rather than queried per session: one read of a store she has
      // a few thousand rows in beats one read per session she has hundreds of.
      const attendance = (await db.getAll('attendance')).filter(a => ids.has(a.sessionId));
      return { from, to, today, students, slots, sessions, attendance };
    },

    // --- write paths (each materializes, then re-derives attendance) ---
    async recordValue({ dateStr, slot, studentId, objectiveId, fieldId, raw }) {
      const session = await ensureSession(dateStr, slot);
      const objective = await db.get('objectives', objectiveId);
      if (!objective) throw new Error('unknown objective: ' + objectiveId);
      const existing = (await db.getAllBy('datapoints', 'sessionId', session.id))
        .find(d => d.studentId === studentId && d.objectiveId === objectiveId);
      const dp = existing || m.datapoint({ sessionId: session.id, studentId, objective });
      m.setValue(dp, objective, fieldId, raw);
      dp.updatedAt = m.now();
      await db.put('datapoints', dp);
      await deriveAttendance(session, studentId);
      return dp;
    },

    async setAttendance({ dateStr, slot, studentId, status }) {
      if (status !== null && !m.ATTENDANCE_STATUSES.includes(status)) {
        throw new Error('unknown attendance status: ' + status);
      }
      const session = await ensureSession(dateStr, slot);
      const existing = await rowFor('attendance', session.id, studentId);
      const row = existing || m.attendance({
        sessionId: session.id, studentId, status,
        participation: session.roster.includes(studentId) ? 'scheduled' : 'added',
      });
      row.status = status;
      row.updatedAt = m.now();
      await db.put('attendance', row);
      return row;
    },

    // Undoing an explicit mark — Today's Absent toggle clicked a second time. It is a
    // withdrawal, not a deletion, and it runs through deriveAttendance rather than a
    // raw db.del so there is exactly ONE place that knows a booked makeup's row must
    // survive with its status reset (see the comment there, and
    // docs/adr/0002-clearing-a-note-keeps-the-makeup-booking.md). Blanking the status
    // first is what lets derivation speak: with a status set, its stickiness rule would
    // simply hand the mark she is undoing straight back.
    async clearAttendance({ dateStr, slot, studentId }) {
      const session = await ensureSession(dateStr, slot);
      const existing = await rowFor('attendance', session.id, studentId);
      if (existing) {
        existing.status = null;
        existing.updatedAt = m.now();
        await db.put('attendance', existing);
      }
      return deriveAttendance(session, studentId);
    },

    // "I missed this whole session" is a bulk write, not a second field. A session-level
    // status plus per-student rows can contradict each other, and something then has to
    // arbitrate — a bug generator and an extra concept for a reader to hold. One source
    // of truth.
    //
    // A mark she already made by hand outranks the sweep, which is the same stickiness
    // rule deriveAttendance applies above. It is also the arithmetically right answer:
    // a child who was not there generates no debt, so sweeping `missed` over an `absent`
    // would invent minutes she does not owe. The per-cell popover is the way to change
    // one deliberately.
    async setSessionAttendance({ dateStr, slot, status }) {
      if (status !== null && !m.ATTENDANCE_STATUSES.includes(status)) {
        throw new Error('unknown attendance status: ' + status);
      }
      const session = await ensureSession(dateStr, slot);
      const existing = {};
      for (const r of await db.getAllBy('attendance', 'sessionId', session.id)) {
        existing[r.studentId] = r;
      }
      const written = [];
      for (const studentId of session.roster) {
        const prior = existing[studentId];
        if (prior && prior.status && prior.status !== 'present') continue;   // hers
        const row = prior || m.attendance({
          sessionId: session.id, studentId, status,
          participation: 'scheduled',
        });
        row.status = status;
        row.updatedAt = m.now();
        await db.put('attendance', row);
        written.push(row);
      }
      return written;
    },

    // A one-off booked outside the recurring schedule. It is a session with no slot,
    // which planForDate already folds into Today — so it appears there with no further
    // work, and never on Schedule, which is the recurring week.
    //
    // The row is written with a null status on purpose: `present` here would credit
    // the debt to zero the instant she books, before the session has happened. The row
    // exists to carry isMakeup; charting it on Today fills the outcome in.
    async bookMakeup({ date, startTime, endTime, location = '', studentId }) {
      const session = m.session({ date, slotId: null, startTime, endTime, location,
                                  roster: [studentId] });
      await db.put('sessions', session);
      const attendance = m.attendance({
        sessionId: session.id, studentId, status: null,
        participation: 'scheduled', isMakeup: true });
      await db.put('attendance', attendance);
      return { session, attendance };
    },

    // Same reasoning as deleteObjective: a session removed without its rows leaves
    // records nothing can ever read again — off the screen, but still in every backup
    // she makes afterwards.
    async deleteMakeup(sessionId) {
      for (const store of ['attendance', 'notes', 'datapoints']) {
        for (const row of await db.getAllBy(store, 'sessionId', sessionId)) {
          await db.del(store, row.id);
        }
      }
      await db.del('sessions', sessionId);
    },

    async saveNote({ dateStr, slot, studentId, text }) {
      const session = await ensureSession(dateStr, slot);
      const existing = await rowFor('notes', session.id, studentId);
      const row = existing || m.note({ sessionId: session.id, studentId });
      row.text = text;
      row.updatedAt = m.now();
      await db.put('notes', row);
      await deriveAttendance(session, studentId);
      return row;
    },

    async addStudentToSession(sessionId, studentId) {
      const session = await db.get('sessions', sessionId);
      if (!session || session.roster.includes(studentId)) return session;
      session.roster.push(studentId);
      await db.put('sessions', session);
      await db.put('attendance', m.attendance({
        sessionId, studentId, status: 'present', participation: 'added',
      }));
      return session;
    },

    async removeStudentFromSession(sessionId, studentId) {
      const session = await db.get('sessions', sessionId);
      if (!session) return null;
      session.roster = session.roster.filter(id => id !== studentId);
      await db.put('sessions', session);
      for (const store of ['attendance', 'notes', 'datapoints']) {
        for (const row of await db.getAllBy(store, 'sessionId', sessionId)) {
          if (row.studentId === studentId) await db.del(store, row.id);
        }
      }
      // The attendance row that just went may have been a booked makeup's, and a
      // slotless session with an empty roster is then an orphan: planForDate keeps
      // drawing it on Today, while the grid's delete control — gated on isMakeup —
      // can no longer reach it. Cancel the appointment outright instead of stranding
      // it. A slotted session stays: its slot still owns that day, so she can put
      // someone back into it. See docs/adr/0002-clearing-a-note-keeps-the-makeup-booking.md.
      if (!session.slotId && !session.roster.length) {
        await this.deleteMakeup(sessionId);
        return null;
      }
      return session;
    },

    async historyFor(studentId, { from = null, to = null } = {}) {
      const sessions = (await db.getAll('sessions'))
        .filter(s => s.roster.includes(studentId))
        .filter(s => (!from || s.date >= from) && (!to || s.date <= to))
        .sort((a, b) => b.date.localeCompare(a.date) ||
                        b.startTime.localeCompare(a.startTime));
      const out = [];
      for (const session of sessions) {
        out.push({
          session,
          attendance: await rowFor('attendance', session.id, studentId),
          note: await rowFor('notes', session.id, studentId),
          datapoints: (await db.getAllBy('datapoints', 'sessionId', session.id))
            .filter(d => d.studentId === studentId),
        });
      }
      return out;
    },

    async rowsForObjective(studentId, objectiveId) {
      const dps = (await db.getAllBy('datapoints', 'objectiveId', objectiveId))
        .filter(d => d.studentId === studentId);
      const rows = [];
      for (const dp of dps) {
        const session = await db.get('sessions', dp.sessionId);
        if (session) rows.push({ date: session.date, dp });
      }
      return rows.sort((a, b) => a.date.localeCompare(b.date));
    },
  };
})();

// ============================================================
// SECTION: derive — everything computed, nothing stored.
// Progress is measured within one objective over time. Never across objectives.
// ============================================================
SLP.derive = (() => {
  const m = SLP.model;

  // Has she actually charted this student in this slot?
  function touched(entry, studentId) {
    const note = entry.notes[studentId];
    if (note && note.text && note.text.trim()) return true;
    const dps = entry.datapoints[studentId] || {};
    return Object.values(dps).some(m.hasEnteredData);
  }

  // A slot and a session both carry startTime/endTime, so one helper reads both.
  // Session times are snapshotted at materialization, which is why minutes need no
  // stored field: a later edit of the slot can never rewrite what a past session was
  // worth. Unusable input is 0, never NaN — a single NaN would poison a whole column.
  function minutesOf(span) {
    const toMin = t => {
      const parts = String(t == null ? '' : t).split(':');
      const hh = Number(parts[0]), mm = Number(parts[1]);
      return Number.isFinite(hh) && Number.isFinite(mm) ? hh * 60 + mm : null;
    };
    const a = toMin(span && span.startTime), b = toMin(span && span.endTime);
    if (a === null || b === null) return 0;
    return Math.max(0, b - a);
  }

  // Her number, not the child's. Two rules, and one of them is load-bearing:
  //
  // The `!r.isMakeup` on the debt line stops a missed makeup adding a SECOND helping
  // of debt for the one obligation it was booked to settle — she would owe 60 minutes
  // for a single skipped session, and the figure would drift upward every time a
  // makeup slipped. A missed makeup is correctly a no-op: the original debt stands.
  //
  // `owed` clamps at zero because over-delivering is not a bank balance. Giving a
  // child an extra 30 minutes does not entitle her to skip 30 later.
  function makeupBalance(rows) {
    let debt = 0, credit = 0;
    for (const r of rows || []) {
      if (r.status === 'missed' && !r.isMakeup) debt += r.minutes || 0;
      if (r.status === 'present' && r.isMakeup) credit += r.minutes || 0;
    }
    return { debt, credit, owed: Math.max(0, debt - credit) };
  }

  // The child's number, and it goes home to a parent — which is why `missed` and
  // `cancelled` are absent from both lines. Neither was an opportunity the child
  // declined, and leaving them in would put her own paperwork and a district snow
  // day onto a child's attendance record. Her misses do not vanish; they are the
  // debt above, reported separately.
  //
  // `isMakeup` does not appear here at all. A makeup is simply a session that was
  // offered: held, it lands in both lines; no-showed, in `offered` alone. So the
  // figure can never exceed 100%.
  //
  // held/offered are MINUTES — that is what the percentage divides, and it stays
  // honest for a student carrying two session lengths. The session counts travel
  // alongside because "8 of 9" is what she writes in the note; they are a label,
  // never the divisor.
  function attendancePct(rows, { today } = {}) {
    let heldMinutes = 0, offeredMinutes = 0;
    let heldSessions = 0, offeredSessions = 0, uncharted = 0;
    for (const r of rows || []) {
      // A range running to the end of the quarter holds sessions that have not
      // happened. Counting them would accuse her of being behind on paperwork
      // until the quarter's final day.
      if (today && r.date > today) continue;
      if (!r.status) { uncharted++; continue; }
      if (r.status !== 'present' && r.status !== 'absent') continue;
      offeredMinutes += r.minutes || 0;
      offeredSessions++;
      if (r.status === 'present') { heldMinutes += r.minutes || 0; heldSessions++; }
    }
    // Nothing offered is not zero percent — that reads as a child who never came.
    const pct = offeredMinutes > 0
      ? Math.round((heldMinutes / offeredMinutes) * 100) : null;
    return { pct, heldMinutes, offeredMinutes, heldSessions, offeredSessions, uncharted };
  }

  const WEEKEND = new Set([0, 6]);
  const pad2 = n => String(n).padStart(2, '0');

  // Parsed as a local date so a range never shifts a day by timezone — the same
  // reason store.dayOfWeek does it this way.
  function dowOf(dateStr) {
    const [y, mo, d] = String(dateStr).split('-').map(Number);
    return new Date(y, mo - 1, d).getDay();
  }

  function eachDate(from, to) {
    const [y, mo, d] = String(from).split('-').map(Number);
    const cur = new Date(y, mo - 1, d);
    const out = [];
    // A guard, not a limit: 400 days is longer than any range she would pick, and
    // it stops a malformed `to` spinning the loop forever. An inverted range
    // (`from > to`) yields nothing rather than looping to the cap.
    if (!from || !to || from > to) return out;
    while (out.length < 400) {
      const ds = cur.getFullYear() + '-' + pad2(cur.getMonth() + 1) + '-' + pad2(cur.getDate());
      if (ds > to) break;
      out.push(ds);
      cur.setDate(cur.getDate() + 1);
    }
    return out;
  }

  // Her default range. `new Date(y, mo, 0)` is the last day of month `mo` — the
  // zeroth day of the next one — so February needs no special case.
  function monthRange(dateStr) {
    const [y, mo] = String(dateStr).split('-').map(Number);
    const last = new Date(y, mo, 0).getDate();
    return { from: y + '-' + pad2(mo) + '-01', to: y + '-' + pad2(mo) + '-' + pad2(last) };
  }

  // A student owed 90 minutes gets a 30-minute makeup proposed, not a 90-minute one:
  // she settles a debt over several sessions, not in one marathon a child could not
  // sit through. The cap is that student's own longest regular session — someone
  // else's two-hour block is not a ceiling on hers.
  function makeupDuration(owedMinutes, slots, studentId) {
    const mine = (slots || []).filter(s => (s.studentIds || []).includes(studentId));
    const cap = mine.reduce((max, s) => Math.max(max, minutesOf(s)), 0);
    return cap ? Math.min(owedMinutes, cap) : owedMinutes;
  }

  // Her paper form, with the arithmetic done. Pure: hand it the output of
  // store.attendanceRange and it returns everything on screen — no IndexedDB, no
  // await, so the whole page is testable without the harness opening a database.
  function attendanceGrid(data) {
    const { from, to, today, students = [], slots = [],
            sessions = [], attendance = [] } = data || {};
    const inRange = sessions.filter(s => s.date >= from && s.date <= to);

    // Weekdays are her form; a session is a fact. A makeup booked on a Saturday would
    // otherwise be written to the database and then be invisible on the page that owns it.
    const hasSession = new Set(inRange.map(s => s.date));
    const dates = eachDate(from, to)
      .filter(ds => !WEEKEND.has(dowOf(ds)) || hasSession.has(ds));

    // The columns are the truth. `inRange` above is what the *dates* are built from, so
    // it has to stay — but the arithmetic reads `drawn`, the sessions that actually got a
    // column, because the two filters otherwise agree only by accident and come apart on
    // one keystroke: a cleared date input makes `from` '', and every date string compares
    // `>= ''`, so `inRange` becomes the student's whole history under two date inputs
    // showing something else; a year mistyped as 2016 spans a decade beside the 400
    // columns eachDate's cap silently allows. Deriving one from the other makes a
    // percentage over sessions she cannot see impossible by construction, rather than
    // adding a second guard that can drift out of step the way these two did.
    const onGrid = new Set(dates);
    const drawn = inRange.filter(s => onGrid.has(s.date));

    const rowsBySession = {};
    for (const a of attendance) {
      (rowsBySession[a.sessionId] || (rowsBySession[a.sessionId] = {}))[a.studentId] = a;
    }

    // A materialized session outranks the slot it came from: its roster and times are
    // the snapshot of what actually happened, and the slot may have been edited since.
    const spokenFor = new Set(drawn.filter(s => s.slotId).map(s => s.date + '|' + s.slotId));

    const rows = students.map(student => {
      const cells = {};
      const push = (date, cell) => (cells[date] || (cells[date] = [])).push(cell);

      for (const session of drawn) {
        if (!(session.roster || []).includes(student.id)) continue;
        const row = (rowsBySession[session.id] || {})[student.id] || null;
        push(session.date, {
          sessionId: session.id, slotId: session.slotId,
          startTime: session.startTime, minutes: minutesOf(session),
          state: (row && row.status) || 'unmarked',
          isMakeup: !!(row && row.isMakeup),
        });
      }

      for (const date of dates) {
        const dow = dowOf(date);
        for (const slot of slots) {
          if (slot.dayOfWeek !== dow) continue;
          if (!(slot.studentIds || []).includes(student.id)) continue;
          if (spokenFor.has(date + '|' + slot.id)) continue;
          push(date, {
            sessionId: null, slotId: slot.id,
            startTime: slot.startTime, minutes: minutesOf(slot),
            state: 'unmarked', isMakeup: false,
          });
        }
      }

      for (const list of Object.values(cells)) {
        list.sort((a, b) => String(a.startTime).localeCompare(String(b.startTime)));
      }

      // Both numbers come off the same cells; they differ only in which they read.
      const flat = Object.entries(cells).flatMap(([date, list]) => list.map(c => ({
        date, minutes: c.minutes, isMakeup: c.isMakeup,
        status: c.state === 'unmarked' ? null : c.state,
      })));

      return { student, cells,
               pct: attendancePct(flat, { today }),
               owed: makeupBalance(flat) };
    });

    return { dates, rows };
  }

  function studentState(entry, studentId) {
    const a = entry.attendance[studentId];
    if (a && a.status && a.status !== 'present') return a.status;   // absent / missed / cancelled
    if (a && a.status === 'present') return 'present';
    // A null status carries no outcome, so fall through: whether she has charted
    // anything is the honest answer, exactly as it is for a student with no row.
    return touched(entry, studentId) ? 'present' : 'none';
  }

  function chartedCount(plan) {
    let charted = 0, total = 0;
    for (const entry of plan) {
      for (const s of entry.students) {
        total++;
        if (studentState(entry, s.id) !== 'none') charted++;
      }
    }
    return { charted, total };
  }

  // How much of one student's data entry is already done. Today collapses a
  // student's objectives by default, so the card has to be able to say what it
  // is putting away — hidden data that gives no sign of itself is the mistake
  // deleteObjective used to make.
  function objectivesCharted(entry, studentId) {
    const objectives = (entry.objectives[studentId] || []).flatMap(b => b.objectives);
    const dps = entry.datapoints[studentId] || {};
    let charted = 0;
    for (const o of objectives) if (dps[o.id] && m.hasEnteredData(dps[o.id])) charted++;
    return { charted, total: objectives.length };
  }

  function pair(objective) {
    const a = objective.fields.filter(f => f.role === 'achieved');
    const t = objective.fields.filter(f => f.role === 'target');
    return (a.length === 1 && t.length === 1) ? { achieved: a[0], target: t[0] } : null;
  }

  function series(objective, rows) {
    const p = pair(objective);
    if (p) {
      const points = [];
      for (const { date, dp } of rows) {
        const r = m.ratio(objective, dp);
        if (r) points.push({ date, value: r.pct, label: r.achieved + ' / ' + r.target });
      }
      return [{ fieldId: p.achieved.id, label: objective.fields.find(f => f.role === 'achieved').label,
                kind: 'pct', points }];
    }
    return objective.fields
      .filter(f => f.type === 'number')
      .map(f => ({
        fieldId: f.id, label: f.label, kind: 'raw',
        points: rows
          .filter(({ dp }) => dp.values[f.id] && dp.values[f.id].entered)
          .map(({ date, dp }) => ({ date, value: dp.values[f.id].value,
                                    label: String(dp.values[f.id].value) })),
      }));
  }

  // Her goal text says "in 3 out of 4 trials across three sessions" — the pair is the
  // criterion, so meeting it is simply achieved >= target.
  function mastery(objective, rows, { window = 3 } = {}) {
    if (!pair(objective)) return null;
    const measured = rows
      .map(({ dp }) => m.ratio(objective, dp))
      .filter(Boolean);
    if (!measured.length) return { met: 0, of: 0, window, mastered: false };
    const recent = measured.slice(-window);
    const met = recent.filter(r => r.achieved >= r.target).length;
    return { met, of: recent.length, window, mastered: recent.length === window && met === window };
  }

  // Her schools are not a table — they are whatever her students say they are, so a
  // school appears the moment she types it and leaves once no student is left using it.
  // Former students count: their school is still a real school she works at.
  function schools(students) {
    const byKey = new Map();                       // lowercased name -> first spelling seen
    for (const s of students || []) {
      const name = String(s.school || '').trim();
      if (!name) continue;
      const key = name.toLowerCase();
      if (!byKey.has(key)) byKey.set(key, name);
    }
    return [...byKey.values()].sort((a, b) => a.localeCompare(b));
  }

  // Typing "lincoln elementary" under an existing "Lincoln Elementary" must not fork the
  // list into two schools, so a case-insensitive hit stores the spelling already on file.
  function canonicalSchool(known, typed) {
    const name = String(typed || '').trim();
    if (!name) return '';
    const key = name.toLowerCase();
    return (known || []).find(k => String(k).toLowerCase() === key) || name;
  }

  return { studentState, chartedCount, objectivesCharted, series, mastery, pair, minutesOf,
           makeupBalance, attendancePct, attendanceGrid, schools, canonicalSchool, monthRange,
           makeupDuration };
})();

// ============================================================
// SECTION: backup — the safety net.
// persist() was DENIED on her machine: storage is evictable and
// "Clear browsing data" wipes it. This section is load-bearing.
// ============================================================
SLP.backup = (() => {
  const db = SLP.db, m = SLP.model;
  const SCHEMA_VERSION = 1;

  const pad = n => String(n).padStart(2, '0');
  function today() {
    const d = new Date();
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }

  async function meta() {
    return (await db.get('meta', 'meta')) ||
      { id: 'meta', schemaVersion: SCHEMA_VERSION, lastBackupAt: null, backupFileHandle: null };
  }

  async function exportObject() {
    const data = {};
    for (const store of db.STORES) {
      // The handle is a live browser object; it must not travel inside a JSON file.
      data[store] = store === 'meta' ? [] : await db.getAll(store);
    }
    return {
      schemaVersion: SCHEMA_VERSION,
      appVersion: SLP.version,
      exportedAt: m.now(),
      data,
    };
  }

  const exportText = async () => JSON.stringify(await exportObject(), null, 2);
  const filename = () => 'slp-data-' + today() + '.json';

  async function markBackedUp() {
    const meta_ = await meta();
    meta_.lastBackupAt = m.now();
    await db.put('meta', meta_);
  }

  const hasFileApi = () => typeof window.showSaveFilePicker === 'function';

  async function pickBackupFile() {
    if (!hasFileApi()) return false;
    const handle = await window.showSaveFilePicker({
      suggestedName: filename(),
      types: [{ description: 'SLP backup', accept: { 'application/json': ['.json'] } }],
    });
    const meta_ = await meta();
    meta_.backupFileHandle = handle;   // structured-cloneable; survives restart
    await db.put('meta', meta_);
    return true;
  }

  async function writeToHandle() {
    const meta_ = await meta();
    const handle = meta_.backupFileHandle;
    if (!handle) return 'no-handle';
    if (handle.queryPermission) {
      let perm = await handle.queryPermission({ mode: 'readwrite' });
      if (perm !== 'granted' && handle.requestPermission) {
        perm = await handle.requestPermission({ mode: 'readwrite' });
      }
      if (perm !== 'granted') return 'denied';
    }
    const writable = await handle.createWritable();
    await writable.write(await exportText());
    await writable.close();
    await markBackedUp();
    return 'ok';
  }

  async function download() {
    const blob = new Blob([await exportText()], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename();
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    await markBackedUp();
  }

  async function backupNow() {
    const via = await writeToHandle();
    if (via === 'ok') return { via: 'handle' };
    await api.download();     // through the exported object, so it stays a testable seam
    return { via: 'download' };
  }

  // Validate the WHOLE payload before touching the database. A truncated or foreign
  // file must never leave her with half a caseload.
  //
  // Reading and committing are deliberately separate: she is shown what a file holds,
  // and what it would cost her, while everything of hers is still on disk. Nothing
  // here writes — parseBackup is safe to call on a file she has not agreed to yet.
  function parseBackup(text) {
    let parsed;
    try {
      parsed = JSON.parse(text);
    } catch (e) {
      throw new Error('That file is not valid JSON — it may be damaged or the wrong file.');
    }
    if (!parsed || typeof parsed !== 'object' || !parsed.data || typeof parsed.data !== 'object') {
      throw new Error('That does not look like an SLP Session Tracker backup.');
    }
    if (typeof parsed.schemaVersion !== 'number') {
      throw new Error('That backup has no schema version — it is not an SLP backup.');
    }
    if (parsed.schemaVersion > SCHEMA_VERSION) {
      throw new Error('That backup was written by a newer version of the app (v' +
                      parsed.schemaVersion + '). Use the newer app file to open it.');
    }
    for (const store of db.STORES) {
      if (store === 'meta') continue;
      if (!Array.isArray(parsed.data[store])) {
        throw new Error('That backup is incomplete — the "' + store +
                        '" section is missing. Nothing was changed.');
      }
    }
    const counts = {};
    for (const store of db.STORES) {
      if (store === 'meta') continue;
      counts[store] = parsed.data[store].length;
    }
    return { parsed, counts, exportedAt: parsed.exportedAt || null };
  }

  async function applyBackup({ parsed }) {
    const keepMeta = await meta();           // the file handle is local, not part of the backup
    await db.clearAll();
    const restored = {};
    for (const store of db.STORES) {
      if (store === 'meta') continue;
      const rows = parsed.data[store];
      if (rows.length) await db.bulkPut(store, rows);
      restored[store] = rows.length;
    }
    await db.put('meta', keepMeta);
    return { restored };
  }

  async function restoreFromText(text) {
    return applyBackup(parseBackup(text));
  }

  // Emptying the app for a fresh year, or after a load of test data. Keeps meta for the
  // same reason applyBackup does: the file handle is where her backups GO, not part of
  // what she is clearing, and dropping it would silently stop backups on the very screen
  // that just reassured her. lastBackupAt stays too — it remains a true statement about
  // what is in that file, which is exactly the copy this clearing is safe because of.
  async function startFresh() {
    const keepMeta = await meta();
    const cleared = {};
    for (const store of db.STORES) {
      if (store === 'meta') continue;
      cleared[store] = (await db.getAll(store)).length;
    }
    await db.clearAll();
    await db.put('meta', keepMeta);
    return { cleared };
  }

  // How long ago, in the units the question is actually asked in. Day granularity was
  // useless during the day it matters most: she backs up after first period and the line
  // still reads "today" — the same words as before she pressed it, so the button appears
  // to have done nothing. A school day is measured in minutes and hours.
  function sinceLabel(iso, now = new Date()) {
    if (!iso) return 'never backed up';
    const secs = (now.getTime() - new Date(iso).getTime()) / 1000;
    // A restored file from a machine an hour ahead, or a clock set back, must not produce
    // "in 40 minutes" on a line about the past. The recent end is the honest place to land.
    if (secs < 60) return 'just now';
    const plural = (n, word) => n + ' ' + word + (n === 1 ? '' : 's') + ' ago';
    const mins = Math.floor(secs / 60);
    if (mins < 60) return plural(mins, 'minute');
    const hours = Math.floor(mins / 60);
    if (hours < 24) return plural(hours, 'hour');
    const days = Math.floor(hours / 24);
    return days === 1 ? 'yesterday' : plural(days, 'day');
  }

  async function status() {
    const meta_ = await meta();
    const staleDays = meta_.lastBackupAt
      ? Math.floor((Date.now() - new Date(meta_.lastBackupAt).getTime()) / 86400000)
      : null;
    return { lastBackupAt: meta_.lastBackupAt, hasHandle: !!meta_.backupFileHandle,
             // Naming the file is what turns "a backup exists somewhere" into something
             // she can actually go and look at.
             fileName: (meta_.backupFileHandle && meta_.backupFileHandle.name) || null,
             // staleDays still drives the nag, which is a threshold question ("has it been
             // too long"); since is the human answer to "when".
             since: sinceLabel(meta_.lastBackupAt),
             staleDays };
  }

  const api = { exportObject, exportText, filename, download, hasFileApi, pickBackupFile,
                writeToHandle, backupNow, parseBackup, applyBackup, restoreFromText,
                startFresh, status, sinceLabel, SCHEMA_VERSION };
  return api;
})();

// ============================================================
// SECTION: ui.shell — DOM helpers, tab router, boot.
// ============================================================
SLP.ui = (() => {
  const $ = sel => document.querySelector(sel);
  const $$ = sel => Array.from(document.querySelectorAll(sel));
  const clear = el => { while (el.firstChild) el.removeChild(el.firstChild); return el; };

  function h(tag, attrs, ...children) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v === null || v === undefined || v === false) continue;
      if (k === 'text') el.textContent = v;                    // never innerHTML: her text is data
      else if (k === 'html') el.innerHTML = v;                 // only for app-authored markup
      else if (k === 'class') el.className = v;
      else if (k === 'value') el.value = v;
      else if (k.startsWith('on:')) el.addEventListener(k.slice(3), v);
      else el.setAttribute(k, v === true ? '' : v);
    }
    for (const c of children.flat()) {
      if (c === null || c === undefined || c === false) continue;
      el.appendChild(c instanceof Node ? c : document.createTextNode(String(c)));
    }
    return el;
  }

  const pad = n => String(n).padStart(2, '0');
  function todayStr(d = new Date()) {
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }

  const route = { tab: 'today', date: todayStr(), studentId: null };
  const views = {};                                 // filled in by later sections

  let toastTimer = null;
  function toast(msg, kind = 'info') {
    const old = $('.toast');
    if (old) old.remove();
    clearTimeout(toastTimer);
    const t = h('div', { class: 'toast toast-' + kind, text: msg, role: 'status' });
    document.body.appendChild(t);
    toastTimer = setTimeout(() => t.remove(), 2600);
  }

  const TABS = [
    ['today', 'Today'],
    ['students', 'Students'],
    ['schedule', 'Schedule'],
    ['attendance', 'Attendance'],
  ];

  // Every render tears #app down to nothing and rebuilds it, and nothing on the page is
  // its own scroll container — the document is what scrolls. An empty document is only
  // viewport-tall, so the browser clamps the offset to 0 on the way through and she is
  // thrown back to the header on every click. Staying put is right for a re-render in
  // place; it is wrong for arriving somewhere new, which should start at the top. The
  // route says which of the two just happened.
  //
  // The date belongs in that key: paging Today to another day is arriving somewhere new,
  // and ui.today already judges it that way when it clears the expanded cards. Left out,
  // she paged to the next day and landed mid-page, reading a different child than the one
  // she left off on.
  //
  // Note what is deliberately NOT here: a rule for the page shrinking under the saved
  // offset. The browser clamps, and clamping is right — "go to the top when the offset no
  // longer fits" would throw her to the header every time she collapsed a card while
  // reading the end of a long day. Where the shrink is drastic the clamp lands at 0 on its
  // own. Both cases are pinned in tests/scroll-restore.test.js.
  let lastPlace = null;

  async function doRender() {
    const app = $('#app');
    const place = route.tab + '/' + (route.studentId || '') + '/' + (route.date || '');
    const y = place === lastPlace ? window.scrollY : 0;
    lastPlace = place;
    clear(app);
    app.appendChild(
      h('header', { class: 'app-header' },
        h('p', { class: 'app-title', text: 'SLP Session Tracker' }),
        h('nav', { class: 'tabs' },
          TABS.map(([id, label]) =>
            h('button', {
              class: 'tab' + (route.tab === id ? ' active' : ''),
              'data-tab': id, type: 'button',
              'on:click': () => go({ tab: id }),
            }, label)))));

    if (SLP.ui.backup) for (const el of await SLP.ui.backup.bar()) app.appendChild(el);

    const root = h('div', { class: 'view', id: 'view-' + route.tab });
    app.appendChild(root);
    const view = views[route.tab];
    if (view) await view(root);
    else root.appendChild(h('p', { class: 'empty', text: 'Nothing here yet.' }));

    // Version stamp. The app is hosted now, so "did you get the update?" has to be
    // answerable over the phone — she reads this number back.
    app.appendChild(h('p', { class: 'app-version', text: 'v' + SLP.version }));

    window.scrollTo(0, y);
  }

  // Coalescing render loop. Two problems this solves at once:
  //  1. Overlapping renders (a click handler's own render() racing a caller's
  //     explicit one) must not both call clear(app) concurrently — that
  //     detaches whichever root loses the race mid-build.
  //  2. A caller awaiting render() right after triggering a write (whose own
  //     handler re-renders once the write settles) must see the FINAL state,
  //     not whatever was on screen the instant its own call happened to
  //     resolve. So every render() call waits for the render loop to run to
  //     quiescence — if another render is requested while one is in flight,
  //     the loop runs again before anyone waiting is told it's done.
  let rendering = false;
  let renderAgain = false;
  let waiters = [];

  function render() {
    return new Promise(resolve => {
      waiters.push(resolve);
      if (rendering) { renderAgain = true; return; }
      runRenderLoop();
    });
  }

  async function runRenderLoop() {
    rendering = true;
    do {
      renderAgain = false;
      await doRender();
    } while (renderAgain);
    rendering = false;
    const done = waiters;
    waiters = [];
    done.forEach(fn => fn());
  }

  async function go(patch) {
    Object.assign(route, patch);
    await render();
  }

  // The one grade picker. It lives here rather than in ui.schedule because the caseload
  // add form, the caseload edit row, and the students filter must never disagree about
  // what a grade is; blankLabel is the only thing that legitimately differs between them.
  function gradeSelect(id, value, blankLabel) {
    return h('select', { id },
      h('option', { value: '', text: blankLabel }),       // grade stays optional
      SLP.model.GRADES.map(g => {
        const opt = h('option', { value: g.value, text: g.label });
        if (String(value || '') === g.value) opt.selected = true;
        return opt;
      }));
  }

  // Filtering for a list of students: derive the schools, release a filter whose school
  // has gone, compose the three as AND, build the controls.
  //
  // It briefly had two callers — the caseload had its own list — and keeping the state
  // outside is what kept those two independent. The caseload has since merged into the
  // Students tab, so there is one caller again. Left parameterised rather than folded
  // back in: this is the whole of "what filtering means" in one testable place, and the
  // next list that needs it should not have to reinvent the released-school rule.
  function studentFilters({ idPrefix, state, students, onChange }) {
    // Derived from the students handed in, not from every record: a school nobody
    // in this particular list attends could never match, so offering it is a dead end.
    const schools = SLP.derive.schools(students);
    // Editing the last student out of a school strands a filter pointing at it. Letting
    // go is the only honest move — the alternative is an empty list beside a blank
    // select, which reads as "everyone is gone" with no obvious way back.
    if (state.schoolFilter && !schools.includes(state.schoolFilter)) state.schoolFilter = '';

    const q = (state.search || '').trim().toLowerCase();
    // Every filter is a narrowing, so they compose as AND and an empty one constrains
    // nothing. She can search a name within a grade without either fighting the other.
    const shown = students.filter(s =>
      (!q || s.name.toLowerCase().includes(q)) &&
      (!state.gradeFilter || String(s.grade || '') === state.gradeFilter) &&
      (!state.schoolFilter || s.school === state.schoolFilter));

    // The ids stay caller-specific because her tests, and the CSS below, address
    // individual controls; the classes are what the shared styling hangs off.
    const search = h('input', { type: 'text', id: idPrefix + '-search', class: 'search-filter',
                                placeholder: 'Search…', value: state.search || '' });
    search.addEventListener('input', async () => { state.search = search.value; await onChange(); });

    const grade = gradeSelect(idPrefix + '-grade-filter', state.gradeFilter, 'Any grade');
    grade.addEventListener('change', async () => {
      state.gradeFilter = grade.value;
      await onChange();
    });

    const school = h('select', { id: idPrefix + '-school-filter', class: 'school-filter' },
      h('option', { value: '', text: 'Any school' }),
      schools.map(name => {
        const opt = h('option', { value: name, text: name });
        if (name === state.schoolFilter) opt.selected = true;
        return opt;
      }));
    school.addEventListener('change', async () => {
      state.schoolFilter = school.value;
      await onChange();
    });

    return { el: h('div', { class: 'student-filters' }, search, grade, school), shown };
  }

  return { $, $$, clear, h, route, go, render, views, toast, todayStr, gradeSelect,
           studentFilters };
})();

// ============================================================
// SECTION: ui.schedule — the weekly template.
// The template is not history: editing it never rewrites a past session.
// The caseload used to live here too; it moved to ui.students, where the
// students it edits already were.
// ============================================================
(() => {
  const { h, toast } = SLP.ui;      // go went with the caseload
  const DAYS = [[1, 'Monday'], [2, 'Tuesday'], [3, 'Wednesday'], [4, 'Thursday'], [5, 'Friday']];

  const draft = { studentIds: new Set() };   // survives re-render within the tab

  async function slotForm(students) {
    const day = h('select', { id: 'slot-day' },
      DAYS.map(([v, label]) => h('option', { value: v, text: label })));

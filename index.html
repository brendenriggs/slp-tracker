                               'cannot be undone.' }));
      const box = h('input', { type: 'text', id: 'restore-confirm-phrase', autocomplete: 'off',
                               'aria-label': 'Type ' + PHRASE + ' to confirm',
                               placeholder: PHRASE, value: ui.typed });
      // Updated in place rather than through a re-render, so the caret and what she has
      // already typed survive every keystroke.
      box.addEventListener('input', () => {
        ui.typed = box.value;
        go.disabled = !mayReplace();
      });
      rows.push(h('p', { class: 'confirm-note', text: 'Type ' + PHRASE + ' to continue:' }));
      rows.push(box);
    }

    go.disabled = !mayReplace();
    rows.push(h('div', { class: 'confirm-actions' }, go,
      h('button', { class: 'plain', id: 'restore-confirm-cancel', type: 'button',
                    text: 'Cancel', 'on:click': cancelRestore })));
    return h('div', { id: 'restore-confirm', role: 'group',
                      'aria-label': 'Confirm restore' }, ...rows);
  }

  // What is about to be erased, in her units, while it is all still there. The count is
  // the check that catches the wrong moment: "49 students" reads very differently from
  // the "3 students" of a test run she meant to throw away.
  function clearPanel() {
    const c = ui.clearing;
    const risk = clearRisk();
    const rows = [
      h('p', { class: 'confirm-title', text: 'Empty this app and start fresh?' }),
      h('p', { class: 'confirm-line',
               text: 'This would erase ' + count(c.current.students, 'student') +
                     ' and ' + count(c.current.sessions, 'session') +
                     ', with all their goals, data and notes.' }),
    ];

    if (risk === 'none') {
      rows.push(h('p', { class: 'confirm-note', text: 'There is nothing here to erase yet.' }));
    } else if (risk === 'copied') {
      rows.push(h('p', { class: 'confirm-note',
                         text: 'Your work is backed up to ' +
                               (c.status.fileName || 'your backup file') + ' ' +
                               c.status.since + ', so you could get it back by restoring ' +
                               'that file.' }));
    }

    const go = h('button', { class: 'danger', id: 'start-fresh-go', type: 'button',
                             text: 'Erase everything', 'on:click': confirmStartFresh });

    if (risk === 'only-copy') {
      rows.push(h('p', { class: 'confirm-warn',
                         text: 'This work has never been backed up. Erasing it cannot be ' +
                               'undone — press Back up now first if you might want it.' }));
      const box = h('input', { type: 'text', id: 'start-fresh-phrase', autocomplete: 'off',
                               'aria-label': 'Type ' + CLEAR_PHRASE + ' to confirm',
                               placeholder: CLEAR_PHRASE, value: ui.typed });
      // Updated in place rather than through a re-render, so the caret and what she has
      // already typed survive every keystroke.
      box.addEventListener('input', () => {
        ui.typed = box.value;
        go.disabled = !mayClear();
      });
      rows.push(h('p', { class: 'confirm-note', text: 'Type ' + CLEAR_PHRASE + ' to continue:' }));
      rows.push(box);
    }

    go.disabled = !mayClear();
    rows.push(h('div', { class: 'confirm-actions' }, go,
      h('button', { class: 'plain', id: 'start-fresh-cancel', type: 'button',
                    text: 'Cancel', 'on:click': cancelStartFresh })));
    return h('div', { id: 'start-fresh-confirm', role: 'group',
                      'aria-label': 'Confirm starting fresh' }, ...rows);
  }

  SLP.ui.backup = { bar, backupNow, restoreFromFile, pickFile, confirmRestore, cancelRestore,
                    askStartFresh, confirmStartFresh, cancelStartFresh };
})();

// ============================================================
// SECTION: boot — wire everything up.
// ============================================================
SLP.ready = (async () => {
  await SLP.db.open();
  await SLP.ui.render();
})();
</script>
</body>
</html>

<head>

<title>SLP Session Tracker</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1a1a1a; --muted: #666; --line: #d8d8d8;

<script>

// ============================================================
window.SLP = { version: '0.1.0' };

// ============================================================
// SECTION: boot — wire everything up.
// ============================================================
SLP.ready = Promise.resolve();
</script>

</html>

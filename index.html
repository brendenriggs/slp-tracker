    const start = h('input', { type: 'time', id: 'slot-start', value: '09:00' });
    const end = h('input', { type: 'time', id: 'slot-end', value: '09:30' });
    const location = h('input', { type: 'text', id: 'slot-location', placeholder: 'Room (optional)' });

    const picker = h('div', { id: 'slot-students', style: 'margin:10px 0' },
      students.length
        ? students.map(s => {
            const box = h('input', { type: 'checkbox', 'data-student-id': s.id });
            box.checked = draft.studentIds.has(s.id);
            box.addEventListener('change', () => {
              box.checked ? draft.studentIds.add(s.id) : draft.studentIds.delete(s.id);
            });
            return h('label', { class: 'slot-student', 'data-student-id': s.id }, box, s.name);
          })
        : h('span', { class: 'muted', text: 'Add students above first.' }));

    return h('section', { class: 'panel', id: 'slot-form' },
      h('h2', { text: 'Add a recurring slot' }),
      h('div', { class: 'row-form' }, day, start, 'to', end, location),
      picker,
      h('button', {
        class: 'primary', id: 'add-slot', type: 'button', text: 'Add slot',
        'on:click': async () => {
          const ids = [...draft.studentIds];
          if (!ids.length) { toast('Put at least one student in the slot.', 'warn'); return; }
          if (!start.value || !end.value) { toast('A slot needs a start and end time.', 'warn'); return; }
          if (end.value <= start.value) { toast('The end time must be after the start.', 'warn'); return; }
          await SLP.store.saveSlot(SLP.model.slot({
            dayOfWeek: Number(day.value), startTime: start.value, endTime: end.value,
            studentIds: ids, location: location.value.trim(),
          }));
          draft.studentIds.clear();
          await SLP.ui.render();
        },
      }));
  }

  async function weekGrid(students) {
    const byId = Object.fromEntries(students.map(s => [s.id, s]));
    const slots = await SLP.store.listSlots();
    return h('section', { class: 'panel', id: 'week-grid' },
      h('h2', { text: 'Weekly schedule' }),
      h('div', { class: 'week' },
        DAYS.map(([dow, label]) =>
          h('div', { class: 'day-column', 'data-day': dow },
            h('div', { class: 'day-name', text: label }),
            slots.filter(s => s.dayOfWeek === dow).map(slot =>
              h('div', { class: 'slot-card', 'data-slot-id': slot.id },
                h('div', { class: 'slot-time',
                           text: slot.startTime + '–' + slot.endTime +
                                 (slot.location ? ' · ' + slot.location : '') }),
                h('div', { class: 'slot-roster',
                           text: slot.studentIds.map(id => byId[id] && byId[id].name)
                                   .filter(Boolean).join(', ') || '(no students)' }),
                h('button', {
                  class: 'linkish danger-link delete-slot', type: 'button', text: 'Delete',
                  'on:click': async () => {
                    await SLP.store.deleteSlot(slot.id);
                    toast('Slot deleted. Sessions already charted are untouched.', 'ok');
                    await SLP.ui.render();
                  },
                })))))));
  }

  SLP.ui.views.schedule = async (root) => {
    const students = await SLP.store.listStudents({ activeOnly: true });
    // The week comes first. It used to sit below the caseload, which at 49 students meant
    // scrolling past the whole roster to reach the thing the tab is named after.
    root.appendChild(await weekGrid(await SLP.store.listStudents({})));
    root.appendChild(await slotForm(students));
  };
})();

// ============================================================
// SECTION: ui.students — the caseload: who is on it, and their goals.
// Task 12 adds history and charts to renderDetail().
// ============================================================
(() => {
  const { h, toast } = SLP.ui;
  const m = SLP.model;
  // adding, editing and removing are all "which one thing is open" flags rather than
  // stored form values: render() rebuilds the DOM, and a half-typed name that survived
  // a re-render would be a promise this app cannot keep.
  // editing and removing hold a student id rather than a flag, so that opening a
  // different student cannot inherit a state she armed on the previous one.
  const ui = { search: '', gradeFilter: '', schoolFilter: '', armedDelete: null,
               adding: false, editing: null, removing: null };

  // Name, then whichever of grade and school she has filled in. Built by dropping the
  // blanks rather than by appending, so a missing one never leaves a separator dangling.
  const rowLabel = s => [s.name, s.grade ? m.gradeLabel(s.grade) : null, s.school || null]
    .filter(Boolean).join(' · ');

  const gradeSelect = (id, value) => SLP.ui.gradeSelect(id, value, 'Grade');

  // A native datalist, not a hand-rolled combobox: she gets type-to-filter for free, and
  // anything she types that is new is simply accepted. The trade is discoverability —
  // Chrome gives the input no dropdown arrow at rest (see the placeholder below).
  function schoolBox(id, listId, value, schools) {
    return [
      // Chrome only shows the datalist caret on hover, so the placeholder carries the
      // "there is a list here" message that the control itself never gives her.
      h('input', { type: 'text', id, list: listId, placeholder: 'School — pick or type',
                   value: value || '', autocomplete: 'off' }),
      h('datalist', { id: listId }, schools.map(name => h('option', { value: name }))),
    ];
  }

  // Exported: Task 10 reuses this for ad hoc objective tweaks.
  function fieldEditor(objective, onChange) {
    const wrap = h('div', { class: 'field-editor' });

    for (const f of objective.fields) {
      const label = h('input', { type: 'text', class: 'field-label', value: f.label });
      label.addEventListener('blur', async () => {
        const v = label.value.trim();
        if (!v || v === f.label) return;
        f.label = v;                       // id is untouched: past datapoints keep their values
        await onChange();
      });

      const type = h('select', { class: 'field-type' },
        h('option', { value: 'number', text: 'number' }),
        h('option', { value: 'text', text: 'text' }));
      type.value = f.type;
      type.addEventListener('change', async () => {
        f.type = type.value;
        if (f.type === 'text') { f.default = null; f.role = null; }
        await onChange();
      });

      const row = h('div', { class: 'field-row', 'data-field-id': f.id }, label, type);

      if (f.type === 'number') {
        const def = h('input', { type: 'number', class: 'field-default',
                                 placeholder: 'default',
                                 value: f.default === null || f.default === undefined ? '' : f.default });
        def.addEventListener('blur', async () => {
          const raw = def.value.trim();
          const next = raw === '' ? null : Number(raw);
          if (raw !== '' && !Number.isFinite(next)) { def.value = f.default ?? ''; return; }
          if (next === f.default) return;
          f.default = next;
          await onChange();
        });
        row.appendChild(def);
      }
      if (f.role) row.appendChild(h('span', { class: 'field-role', text: f.role }));

      row.appendChild(h('button', {
        class: 'linkish danger-link remove-field', type: 'button', text: 'remove',
        'on:click': async () => {
          objective.fields = objective.fields.filter(x => x.id !== f.id);
          await onChange();
        },
      }));
      wrap.appendChild(row);
    }

    const newLabel = h('input', { type: 'text', class: 'new-field-label',
                                  placeholder: 'New field name' });
    const newType = h('select', { class: 'new-field-type' },
      h('option', { value: 'number', text: 'number' }),
      h('option', { value: 'text', text: 'text' }));
    wrap.appendChild(h('div', { class: 'row-form', style: 'margin-top:6px' },
      newLabel, newType,
      h('button', {
        class: 'plain add-field', type: 'button', text: 'Add field',
        'on:click': async () => {
          const label = newLabel.value.trim();
          if (!label) { toast('A field needs a name.', 'warn'); return; }
          objective.fields.push(m.field({ label, type: newType.value }));
          await onChange();
        },
      })));
    return wrap;
  }

  function objectiveBlock(student, objective, refresh) {
    const save = async () => { await SLP.store.saveObjective(objective); await refresh(); };
    const armed = ui.armedDelete === objective.id;

    const text = h('textarea', { class: 'goal-edit objective-edit', value: objective.text });
    text.addEventListener('blur', async () => {
      const v = text.value.trim();
      if (!v || v === objective.text) return;
      objective.text = v;
      await save();
    });

    return h('div', { class: 'objective-block', 'data-objective-id': objective.id },
      h('p', { class: 'objective-text',
               text: m.displayText(objective.text, student.name) }),
      text,
      fieldEditor(objective, save),
      armed
        ? h('div', { class: 'row-form', style: 'margin-top:6px' },
            h('span', { class: 'muted',
                        text: 'Delete this objective and everything charted against it?' }),
            h('button', {
              class: 'plain danger-link confirm-delete-objective', type: 'button',
              text: 'Yes, delete',
              'on:click': async () => {
                await SLP.store.deleteObjective(objective.id);
                ui.armedDelete = null;
                toast('Objective deleted.', 'ok');
                await refresh();
              },
            }),
            h('button', {
              class: 'plain cancel-delete-objective', type: 'button', text: 'Keep it',
              'on:click': async () => { ui.armedDelete = null; await refresh(); },
            }))
        : h('button', {
            class: 'linkish danger-link delete-objective', type: 'button', text: 'Delete objective',
            'on:click': async () => { ui.armedDelete = objective.id; await refresh(); },
          }));
  }

  // A tally of zeroes is noise, so an untouched goal just asks. Once there are
  // objectives — or worse, charted sessions — the prompt says what it is taking.
  function goalDeletePrompt({ objectives, sessions }) {
    if (!objectives) return 'Delete this goal?';
    const objs = 'its ' + objectives + (objectives === 1 ? ' objective' : ' objectives');
    if (!sessions) return 'Delete this goal and ' + objs + '?';
    return 'Delete this goal, ' + objs + ', and the data charted in ' +
           sessions + (sessions === 1 ? ' session' : ' sessions') + '?';
  }

  function goalBlock(student, goal, objectives, refresh, stakes) {
    const edit = h('textarea', { class: 'goal-edit', value: goal.text });
    edit.addEventListener('blur', async () => {
      const v = edit.value.trim();
      if (!v || v === goal.text) return;
      goal.text = v;
      await SLP.store.saveGoal(goal);
      await refresh();
    });

    const newObj = h('textarea', { class: 'goal-edit new-objective-text',
                                   placeholder: 'Paste the objective text…' });

    return h('section', { class: 'goal-block', 'data-goal-id': goal.id },
      h('p', { class: 'goal-text clamp', text: m.displayText(goal.text, student.name),
               'on:click': e => e.currentTarget.classList.toggle('open') }),
      edit,
      objectives.map(o => objectiveBlock(student, o, refresh)),
      h('div', { style: 'margin-top:10px' },
        newObj,
        h('button', {
          class: 'plain add-objective', type: 'button', text: 'Add objective',
          'on:click': async () => {
            const t = newObj.value.trim();
            if (!t) { toast('Paste the objective text first.', 'warn'); return; }
            await SLP.store.saveObjective(m.objective({
              goalId: goal.id, text: t, order: objectives.length,
            }));
            await refresh();
          },
        })),
      // Last in the block, well below the controls she uses daily: distance and a
      // second click both have to fail before an IEP goal and its data go.
      ui.armedDelete === goal.id
        ? h('div', { class: 'row-form', style: 'margin-top:10px' },
            h('span', { class: 'muted delete-goal-prompt',
                        text: goalDeletePrompt(stakes || { objectives: 0, sessions: 0 }) }),
            h('button', {
              class: 'plain danger-link confirm-delete-goal', type: 'button',
              text: 'Yes, delete',
              'on:click': async () => {
                await SLP.store.deleteGoal(goal.id);
                ui.armedDelete = null;
                toast('Goal deleted.', 'ok');
                await refresh();
              },
            }),
            h('button', {
              class: 'plain cancel-delete-goal', type: 'button', text: 'Keep it',
              'on:click': async () => { ui.armedDelete = null; await refresh(); },
            }))
        : h('button', {
            class: 'linkish danger-link delete-goal', type: 'button', text: 'Delete goal',
            style: 'margin-top:10px',
            'on:click': async () => { ui.armedDelete = goal.id; await refresh(); },
          }));
  }

  // The heading is also the roster row: it is the one place her name, grade and school
  // appear together, so it is where correcting them belongs. Editing swaps the line for
  // the controls rather than opening a panel elsewhere — the thing being changed stays
  // where she is looking.
  function headingRow(student, schools, refresh) {
    if (ui.editing !== student.id) {
      return h('div', { class: 'detail-heading' },
        h('h2', { text: rowLabel(student) }),
        h('button', { class: 'linkish', id: 'edit-student', type: 'button', text: 'Edit',
                      'on:click': async () => { ui.editing = student.id; await refresh(); } }));
    }
    const grade = gradeSelect('edit-student-grade', student.grade);
    const [school, schoolList] = schoolBox('edit-student-school', 'edit-school-options',
                                           student.school, schools);
    return h('div', { class: 'detail-heading' },
      h('h2', { text: student.name }), grade, school, schoolList,
      h('button', {
        class: 'primary', id: 'save-student', type: 'button', text: 'Save',
        'on:click': async () => {
          await SLP.store.updateStudentDetails(student.id, {
            grade: grade.value,
            school: SLP.derive.canonicalSchool(schools, school.value),
          });
          ui.editing = null;
          await refresh();
        },
      }),
      h('button', {
        class: 'linkish', id: 'cancel-student-edit', type: 'button', text: 'Cancel',
        'on:click': async () => { ui.editing = null; await refresh(); },
      }));
  }

  // Last thing in the pane, below every goal, because it is the one control here that
  // undoes a year of setup. Armed rather than immediate — the same two-step the objective
  // delete uses — so distance and a second click both have to fail before anything moves.
  function removeBlock(student, refresh) {
    if (ui.removing !== student.id) {
      return h('section', { class: 'panel remove-block' },
        h('button', { class: 'linkish danger-link', id: 'remove-student', type: 'button',
                      text: 'Remove from caseload',
                      'on:click': async () => { ui.removing = student.id; await refresh(); } }));
    }
    return h('section', { class: 'panel remove-block' },
      h('p', { class: 'muted',
               text: 'Remove ' + student.name + ' from the caseload? Their sessions, goals ' +
                     'and data are all kept — they just stop appearing on your lists.' }),
      h('div', { class: 'row-form' },
        h('button', {
          class: 'plain danger-link', id: 'confirm-remove-student', type: 'button',
          text: 'Yes, remove ' + student.name,
          'on:click': async () => {
            await SLP.store.setStudentActive(student.id, false);
            ui.removing = null;
            toast(student.name + ' removed from the caseload. Their history is kept.', 'ok');
            await SLP.ui.go({ studentId: null });
          },
        }),
        h('button', {
          class: 'plain', id: 'cancel-remove-student', type: 'button', text: 'Keep them',
          'on:click': async () => { ui.removing = null; await refresh(); },
        })));
  }

  async function renderDetail(container, student, schools) {
    const refresh = () => SLP.ui.render();
    const detail = h('div', { id: 'student-detail' },
      headingRow(student, schools, refresh));

    const blocks = await SLP.store.objectivesForStudent(student.id);
    if (!blocks.length) {
      detail.appendChild(h('p', { class: 'muted',
        text: 'No goals yet. Paste the IEP goal below — you only do this once.' }));
    }
    for (const { goal, objectives } of blocks) {
      // Only the armed goal pays for the count — the common render touches no extra rows.
      const stakes = ui.armedDelete === goal.id
        ? await SLP.store.goalStakes(goal.id) : null;
      detail.appendChild(goalBlock(student, goal, objectives, refresh, stakes));
    }

    const newGoal = h('textarea', { class: 'goal-edit', id: 'new-goal-text',
                                    placeholder: 'Paste the IEP goal text…' });
    detail.appendChild(h('section', { class: 'panel' },
      h('h2', { text: 'Add a goal' }),
      newGoal,
      h('button', {
        class: 'primary', id: 'add-goal', type: 'button', text: 'Add goal',
        'on:click': async () => {
          const t = newGoal.value.trim();
          if (!t) { toast('Paste the goal text first.', 'warn'); return; }
          await SLP.store.saveGoal(m.goal({ studentId: student.id, text: t,
                                            order: blocks.length }));
          await refresh();
        },
      })));

    // ui.aggregation and ui.attendance append their sections here. Both are defined
    // in later sections of this file, so both are guarded — the detail page renders
    // with whatever has loaded.
    if (SLP.ui.students.renderAttendance) {
      await SLP.ui.students.renderAttendance(detail, student);
    }
    if (SLP.ui.students.renderAggregation) {
      await SLP.ui.students.renderAggregation(detail, student);
    }
    detail.appendChild(removeBlock(student, refresh));   // last, deliberately
    container.appendChild(detail);
  }

  // Adding is start-of-year work, so it is one button until she asks. The form opens in
  // the detail pane, which is wide enough for the three fields on one row; the narrow
  // column beside the list is not.
  function addForm(schools, refresh) {
    const name = h('input', { type: 'text', id: 'new-student-name', placeholder: 'Student name' });
    const grade = gradeSelect('new-student-grade', '');
    const [school, schoolList] = schoolBox('new-student-school', 'school-options', '', schools);
    return h('section', { class: 'panel', id: 'add-student-form' },
      h('h2', { text: 'Add a student' }),
      h('div', { class: 'row-form' },
        name, grade, school, schoolList,
        h('button', {
          class: 'primary', id: 'add-student', type: 'button', text: 'Add student',
          'on:click': async () => {
            if (!name.value.trim()) { toast('A student needs a name.', 'warn'); return; }
            await SLP.store.saveStudent(m.student({
              name: name.value.trim(), grade: grade.value,
              school: SLP.derive.canonicalSchool(schools, school.value),
            }));
            ui.adding = false;
            await refresh();
          },
        }),
        h('button', {
          class: 'linkish', id: 'cancel-add-student', type: 'button', text: 'Cancel',
          'on:click': async () => { ui.adding = false; await refresh(); },
        })));
  }

  SLP.ui.views.students = async (root) => {
    const students = await SLP.store.listStudents({ activeOnly: true });
    // Active-only, so the filters see only the students on screen — a former student's
    // school is never offered here. The state is this tab's own `ui`, which is what
    // keeps it from moving when she filters the caseload over on the Schedule tab.
    const filters = SLP.ui.studentFilters({
      idPrefix: 'student', state: ui, students, onChange: () => SLP.ui.render(),
    });
    const shown = filters.shown;

    const list = h('div', { id: 'student-list' },
      shown.length ? null : h('p', { class: 'muted', text: 'No matching students.' }),
      shown.map(s =>
        h('div', { class: 'student-row', 'data-student-id': s.id, 'data-student-name': s.name },
          h('button', {
            class: 'linkish open-student grow', type: 'button', text: s.name,
            'on:click': () => SLP.ui.go({ studentId: s.id }),
          }))));

    // Counted, not listed: she needs to know the record survived a removal, but a former
    // student among the current ones is a name she could open by mistake.
    const all = await SLP.store.listStudents({});
    const inactive = all.filter(s => !s.active);
    const note = inactive.length
      ? h('p', { class: 'muted', id: 'inactive-note',
                 text: inactive.length + ' former student' + (inactive.length > 1 ? 's' : '') +
                       ' kept for their history.' })
      : null;

    // Schools come from every record, not just the active ones: she is typing here, and a
    // school only a former student attends is still a real school she might spell two ways.
    const schools = SLP.derive.schools(all);
    const refresh = () => SLP.ui.render();

    const addButton = h('button', {
      class: 'plain', id: 'add-student-toggle', type: 'button', text: '+ Add student',
      'on:click': async () => { ui.adding = true; await SLP.ui.go({ studentId: null }); } });

    const detail = h('div');
    const selected = shown.find(s => s.id === SLP.ui.route.studentId) ||
                     students.find(s => s.id === SLP.ui.route.studentId);
    // The form and a student's goals want the same pane, so opening one closes the other.
    // Picking a student is the stronger signal: it is what she just clicked.
    if (selected) {
      ui.adding = false;
      await renderDetail(detail, selected, schools);
    } else if (ui.adding) {
      detail.appendChild(addForm(schools, refresh));
    } else {
      detail.appendChild(h('p', { class: 'empty', text: 'Pick a student to see their goals.' }));
    }

    root.appendChild(h('div', { class: 'split' },
      h('div', {}, filters.el, addButton, list, note),
      detail));
  };

  SLP.ui.students = { fieldEditor };
})();

// ============================================================
// SECTION: ui.today — the transcription grid.
// She is NOT at a computer during a session. This is batch back-fill
// from paper: optimise for tab-through speed across a whole day.
// ============================================================
(() => {
  const { h } = SLP.ui;
  const m = SLP.model;

  const pad = n => String(n).padStart(2, '0');
  const parse = s => { const [y, mo, d] = s.split('-').map(Number); return new Date(y, mo - 1, d); };
  const fmt = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());

  function shiftDate(dateStr, days) {
    const d = parse(dateStr);
    d.setDate(d.getDate() + days);          // handles months, years, and leap days
    return fmt(d);
  }

  // Whose data entry she has opened. Survives re-render within the tab — every
  // absent toggle runs doRender(), which clears #app, so a card that remembered
  // its own state would slam shut whenever she touched someone else's row.
  // In memory only: this is where she is right now, not a preference.
  const expanded = new Set();
  let expandedFor = null;      // the date those ids belong to

  const LONG = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
  const longDate = dateStr => parse(dateStr).toLocaleDateString(undefined, LONG);

  function valueField(entry, student, objective, field, dp) {
    const cell = dp.values[field.id] || { value: field.type === 'number' ? field.default : '', entered: false };
    const input = h('input', {
      class: 'value-input',
      type: field.type === 'number' ? 'number' : 'text',
      'data-field-id': field.id,
      'data-type': field.type,
      'data-entered': String(!!cell.entered),
      'aria-label': m.displayText(objective.text, student.name) + ' — ' + field.label,
      value: cell.value === null || cell.value === undefined ? '' : cell.value,
    });
    // Task 11 wires autosave here.
    if (SLP.ui.today.wireValueInput) {
      SLP.ui.today.wireValueInput(input, { entry, student, objective, field });
    }
    return h('label', { class: 'value-field' },
      h('span', { class: 'cap', text: field.label }), input);
  }

  // Shared by the render and by refreshChrome's surgical update, so the head can
  // never drift from what derive says is charted.
  function setCharted(label, { charted, total }) {
    label.hidden = !charted;
    label.textContent = charted ? charted + ' of ' + total + ' charted' : '';
  }

  function objectiveRow(entry, student, objective) {
    const dp = ((entry.datapoints[student.id] || {})[objective.id]) ||
               m.datapoint({ sessionId: 'pending', studentId: student.id, objective });
    const r = m.ratio(objective, dp);
    return h('div', { class: 'objective-row', 'data-objective-id': objective.id },
      h('div', { class: 'objective-label clamp',
                 text: m.displayText(objective.text, student.name),
                 'on:click': e => e.currentTarget.classList.toggle('open') }),
      h('div', { class: 'objective-inputs' },
        objective.fields.map(f => valueField(entry, student, objective, f, dp)),
        h('span', { class: 'ratio', text: r ? r.achieved + ' / ' + r.target + ' · ' + r.pct + '%' : '' })));
  }

  async function studentBlock(entry, student) {
    const state = SLP.derive.studentState(entry, student.id);
    const att = entry.attendance[student.id];
    const blocks = entry.objectives[student.id] || [];
    const note = entry.notes[student.id];

    const chip = h('span', { class: 'state-chip', 'data-state': state,
      text: state === 'none' ? 'not charted'
          : state === 'present' ? 'present' : state });

    const absentBtn = h('button', {
      class: 'linkish absent-toggle', type: 'button',
      text: state === 'absent' ? 'Mark present' : 'Absent',
      'aria-pressed': String(state === 'absent'),
    });
    if (SLP.ui.today.wireAbsent) SLP.ui.today.wireAbsent(absentBtn, { entry, student, state });

    const noteBox = h('textarea', { class: 'note-input',
      placeholder: 'Session note…', value: note ? note.text : '',
      'aria-label': 'Session note for ' + student.name });
    if (SLP.ui.today.wireNote) SLP.ui.today.wireNote(noteBox, { entry, student });

    // Data entry is put away by default: she writes the session up in prose
    // first and extrapolates it into objective data later.
    const area = h('div', { class: 'objective-area', hidden: true });
    const disclosure = h('button', { class: 'disclosure', type: 'button' });
    const setOpen = open => {
      area.hidden = !open;
      disclosure.textContent = open ? '▾' : '▸';
      disclosure.setAttribute('aria-expanded', String(open));
      disclosure.setAttribute('aria-label',
        (open ? 'Hide' : 'Show') + ' data entry for ' + student.name);
    };
    // Collapsing must not hide data silently, so a charted card says so from the
    // outside. Nothing charted means nothing hidden, and the count would be
    // noise on every student she has not reached yet.
    const chartedLabel = h('span', { class: 'student-charted' });
    setCharted(chartedLabel, SLP.derive.objectivesCharted(entry, student.id));

    setOpen(expanded.has(student.id));
    disclosure.addEventListener('click', () => {
      const open = area.hidden;
      if (open) expanded.add(student.id); else expanded.delete(student.id);
      setOpen(open);
    });

    const block = h('div', {
      class: 'student-block' + (state === 'absent' ? ' is-absent' : ''),
      'data-student-id': student.id, 'data-student-name': student.name,
    },
      h('div', { class: 'student-head' },
        disclosure,
        h('span', { class: 'student-name', text: student.name }),
        chip,
        att && att.participation === 'added' ? h('span', { class: 'added-chip', text: 'added' }) : null,
        chartedLabel,
        h('span', { class: 'grow' }),
        absentBtn,
        SLP.ui.today.removeButton ? SLP.ui.today.removeButton({ entry, student }) : null));

    for (const { goal, objectives } of blocks) {
      // Goal once per student, collapsed — not repeated above each objective.
      area.appendChild(h('p', { class: 'goal-line clamp',
        text: m.displayText(goal.text, student.name),
        'on:click': e => e.currentTarget.classList.toggle('open') }));
      for (const o of objectives) area.appendChild(objectiveRow(entry, student, o));
    }
    if (!blocks.length) {
      area.appendChild(h('p', { class: 'goal-line',
        text: 'No goals set up yet — add them on the Students tab.' }));
    }
    block.appendChild(area);
    block.appendChild(noteBox);
    return block;
  }

  SLP.ui.views.today = async (root) => {
    const date = SLP.ui.route.date;
    // A different day is a fresh page. Only re-renders of the day she is on keep
    // their open cards.
    if (date !== expandedFor) { expanded.clear(); expandedFor = date; }
    const plan = await SLP.store.planForDate(date);
    const { charted, total } = SLP.derive.chartedCount(plan);

    root.appendChild(h('div', { class: 'day-bar' },
      h('button', { class: 'plain', id: 'prev-day', type: 'button', text: '←',
                    'aria-label': 'Previous day',
                    'on:click': () => SLP.ui.go({ date: shiftDate(date, -1) }) }),
      h('span', { id: 'date-label', text: longDate(date) }),
      h('button', { class: 'plain', id: 'next-day', type: 'button', text: '→',
                    'aria-label': 'Next day',
                    'on:click': () => SLP.ui.go({ date: shiftDate(date, 1) }) }),
      h('button', { class: 'plain', id: 'jump-today', type: 'button', text: 'Today',
                    'on:click': () => SLP.ui.go({ date: SLP.ui.todayStr() }) }),
      h('span', { class: 'grow' }),
      h('span', { id: 'charted-count', text: charted + ' of ' + total + ' charted' })));

    if (!plan.length) {
      const noSlots = (await SLP.store.listSlots()).length === 0;
      root.appendChild(h('p', { class: 'empty', text: noSlots
        ? 'No schedule yet. Open the Schedule tab to add students and their weekly slots.'
        : 'Nothing scheduled for this day.' }));
      return;
    }

    for (const entry of plan) {
      const section = h('section', { class: 'slot-section',
                                     'data-slot-id': entry.slot.id || 'adhoc' },
        h('div', { class: 'slot-head' },
          h('span', { text: entry.slot.startTime + '–' + entry.slot.endTime }),
          entry.slot.location ? h('span', { class: 'muted', text: entry.slot.location }) : null,
          h('span', { class: 'grow' }),
          SLP.ui.today.addStudentControl
            ? await SLP.ui.today.addStudentControl(entry)
            : null));
      for (const s of entry.students) section.appendChild(await studentBlock(entry, s));
      root.appendChild(section);
    }
  };

  // --- save queue -------------------------------------------------------
  // Serialises writes so a fast tab-through cannot interleave two saves on
  // the same datapoint. flush() lets tests (and the nag banner) await quiet.
  let chain = Promise.resolve();
  function enqueue(fn) {
    chain = chain.then(fn).catch(err => {
      console.error('save failed', err);
      SLP.ui.toast('That did not save — ' + err.message, 'error');
    });
    return chain;
  }
  const flush = () => chain;

  // The slot object a write path needs. For an ad hoc entry the slot is synthetic,
  // so fall back to the session it already has.
  function slotOf(entry) {
    if (entry.slot && entry.slot.id) return entry.slot;
    return { id: null, ...entry.slot, studentIds: entry.slot.studentIds || [] };
  }

  function wireValueInput(input, { entry, student, objective, field }) {
    const save = () => enqueue(async () => {
      const dp = await SLP.store.recordValue({
        dateStr: SLP.ui.route.date, slot: slotOf(entry), studentId: student.id,
        objectiveId: objective.id, fieldId: field.id, raw: input.value,
      });
      const cell = dp.values[field.id];
      input.dataset.entered = String(!!cell.entered);
      if (!cell.entered) {
        // Reverted to the pre-filled default — show it, do not leave the box blank.
        input.value = cell.value === null || cell.value === undefined ? '' : cell.value;
      }
      await refreshChrome();
    });
    input.addEventListener('change', () => {
      // A pre-filled field that was tabbed past unchanged is not data entry.
      const untouched = input.dataset.entered === 'false' &&
        String(input.value) === String(input.defaultValue);
      if (untouched) return;
      save();
    });
    input.defaultValue = input.value;
  }

  function wireNote(box, { entry, student }) {
    let last = box.value;
    const save = () => {
      if (box.value === last) return;
      last = box.value;
      enqueue(async () => {
        await SLP.store.saveNote({ dateStr: SLP.ui.route.date, slot: slotOf(entry),
                                   studentId: student.id, text: box.value });
        await refreshChrome();
      });
    };
    box.addEventListener('change', save);
    box.addEventListener('blur', save);
  }

  // The actual flip, with no enqueue() of its own — callers control the queue.
  async function toggleAbsentNow(entry, student, state) {
    const next = state === 'absent' ? 'present' : 'absent';
    if (next === 'present') {
      // Undo: withdraw the explicit mark and let attendance derive from data again.
      // The store owns the withdrawal because a booked makeup's row must outlive it —
      // deleting it here took the booking with it. See
      // docs/adr/0002-clearing-a-note-keeps-the-makeup-booking.md.
      await SLP.store.clearAttendance({ dateStr: SLP.ui.route.date, slot: slotOf(entry),
                                        studentId: student.id });
    } else {
      await SLP.store.setAttendance({ dateStr: SLP.ui.route.date, slot: slotOf(entry),
                                      studentId: student.id, status: 'absent' });
    }
    await SLP.ui.render();
  }

  function toggleAbsent(entry, student, state) {
    return enqueue(() => toggleAbsentNow(entry, student, state));
  }

  function wireAbsent(button, ctx) {
    button.addEventListener('click', () => toggleAbsent(ctx.entry, ctx.student, ctx.state));
  }

  async function addStudentControl(entry) {
    const present = new Set(entry.students.map(s => s.id));
    const available = (await SLP.store.listStudents({ activeOnly: true }))
      .filter(s => !present.has(s.id));
    if (!available.length) return null;
    const select = h('select', { class: 'add-student-select', 'aria-label': 'Add a student to this session' },
      h('option', { value: '', text: '+ Add student' }),
      available.map(s => h('option', { value: s.id, text: s.name })));
    select.addEventListener('change', () => {
      const id = select.value;
      if (!id) return;
      enqueue(async () => {
        const session = await SLP.store.ensureSession(SLP.ui.route.date, slotOf(entry));
        await SLP.store.addStudentToSession(session.id, id);
        await SLP.ui.render();
      });
    });
    return select;
  }

  let armedRemoval = null;
  function removeButton({ entry, student }) {
    if (!entry.session) return null;          // nothing to remove from yet
    const key = entry.session.id + ':' + student.id;
    if (armedRemoval === key) {
      return h('span', { class: 'row-form' },
        h('span', { class: 'muted', text: 'Discard everything charted for ' + student.name + '?' }),
        h('button', {
          class: 'linkish danger-link confirm-remove-student', type: 'button', text: 'Yes, remove',
          'on:click': () => enqueue(async () => {
            await SLP.store.removeStudentFromSession(entry.session.id, student.id);
            armedRemoval = null;
            await SLP.ui.render();
          }),
        }),
        h('button', {
          class: 'linkish cancel-remove-student', type: 'button', text: 'Cancel',
          'on:click': async () => { armedRemoval = null; await SLP.ui.render(); },
        }));
    }
    return h('button', {
      class: 'linkish remove-student', type: 'button', text: 'Remove',
      title: 'For a scheduled student who did not show, use Absent — the miss should stay visible.',
      'on:click': async () => { armedRemoval = key; await SLP.ui.render(); },
    });
  }

  // Update just the counter and chip without a full re-render, so focus is never
  // stolen mid-typing. A full render happens on structural changes only.
  async function refreshChrome() {
    const label = document.querySelector('#charted-count');
    if (!label) return;
    const plan = await SLP.store.planForDate(SLP.ui.route.date);
    const { charted, total } = SLP.derive.chartedCount(plan);
    label.textContent = charted + ' of ' + total + ' charted';
    for (const entry of plan) {
      for (const s of entry.students) {
        const block = document.querySelector('.student-block[data-student-id="' + s.id + '"]');
        if (!block) continue;
        const chip = block.querySelector('.state-chip');
        if (chip) {
          const state = SLP.derive.studentState(entry, s.id);
          chip.dataset.state = state;
          chip.textContent = state === 'none' ? 'not charted'
                           : state === 'present' ? 'present' : state;
        }
        const counted = block.querySelector('.student-charted');
        if (counted) setCharted(counted, SLP.derive.objectivesCharted(entry, s.id));
      }
    }
  }

  // Alt+A toggles absence for whichever student block has focus. The listener
  // itself is synchronous so enqueue() runs synchronously within dispatchEvent —
  // an async listener would delay enqueue() past its first await, and a caller
  // that awaits flush() right after dispatching the keydown would miss the task.
  document.addEventListener('keydown', (e) => {
    if (!e.altKey || SLP.ui.route.tab !== 'today') return;
    if (e.key === '.') { e.preventDefault(); SLP.ui.go({ date: SLP.ui.todayStr() }); return; }
    if (e.key !== 'a' && e.key !== 'A') return;
    const block = e.target.closest && e.target.closest('.student-block');
    if (!block) return;
    e.preventDefault();
    enqueue(async () => {
      const plan = await SLP.store.planForDate(SLP.ui.route.date);
      for (const entry of plan) {
        const student = entry.students.find(s => s.id === block.dataset.studentId);
        if (student) {
          await toggleAbsentNow(entry, student, SLP.derive.studentState(entry, student.id));
          return;
        }
      }
    });
  });

  SLP.ui.today = { shiftDate, flush, wireValueInput, wireNote, wireAbsent,
                   addStudentControl, removeButton };
})();

// ============================================================
// SECTION: ui.attendance — the caseload grid.
// Her paper clipboard form, with the arithmetic done for her. One store call does
// all the IO; one pure function produces everything on screen.
// ============================================================
(() => {
  const { h } = SLP.ui;

  // Survives re-render within the tab, like ui.schedule's draft. The range is null
  // until the first render so it can default to whatever month she opens it in.
  const ui = { search: '', gradeFilter: '', schoolFilter: '', range: null,
               marking: null,   // { studentId, date, sessionId, slotId, isMakeup }
               booking: null, armedDelete: null };

  // Glyph AND colour, never colour alone: her highlighter system does not survive a
  // colourblind reader or a grayscale print, and these go home in a folder.
  const GLYPH = { present: '✓', absent: '✗', missed: '–',
                  cancelled: '∅', unmarked: '▫' };
  const LABEL = { present: 'held', absent: 'absent', missed: 'I missed it',
                  cancelled: 'cancelled', unmarked: 'scheduled, unmarked' };

  const dayNum = ds => String(Number(ds.split('-')[2]));

  const MONTH_NAME = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun',
                      'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const monthKey = ds => ds.slice(0, 7);
  const monthLabel = ds => MONTH_NAME[Number(ds.slice(5, 7)) - 1] + ' ' + ds.slice(0, 4);

  // The day row carries day-of-month alone, so a quarter shows "1" three times with
  // nothing to say which month each belongs to. Group the dates into one band above.
  function monthBand(dates) {
    const spans = [];
    dates.forEach(d => {
      const k = monthKey(d);
      const last = spans[spans.length - 1];
      if (last && last.key === k) last.count++;
      else spans.push({ key: k, label: monthLabel(d), count: 1 });
    });
    return spans;
  }

  function pctText(p) {
    if (p.pct === null) return '—';
    let s = p.pct + '% · ' + p.heldSessions + ' of ' + p.offeredSessions;
    // Excluding uncharted sessions quietly would let three charted out of thirty
    // read as a confident 100%. The count travels with the number.
    if (p.uncharted) s += ' · ' + p.uncharted + ' uncharted';
    return s;
  }

  // The spec styles the figure as provisional whenever uncharted is non-zero
  // (spec:174-175). The count alone is not the flag — the number itself must look
  // unfinished, because that is what she reads at a glance onto a progress note.
  const pctProvisional = p => !!(p && p.pct !== null && p.uncharted);

  function cellEl(date, row, cell) {
    return h('button', {
      class: 'att-cell', type: 'button',
      'data-state': cell.state,
      'data-makeup': cell.isMakeup ? 'true' : 'false',
      'data-date': date,
      'data-student-id': row.student.id,
      'data-session-id': cell.sessionId,
      'data-slot-id': cell.slotId,
      'aria-label': row.student.name + ', ' + date + ': ' + LABEL[cell.state] +
                    (cell.isMakeup ? ' (makeup)' : ''),
      'on:click': () => {
        // The popover and the booking form are two ways of acting on the same row;
        // opening one closes the other rather than stacking both under it.
        ui.booking = null;
        ui.marking = {
          studentId: row.student.id, studentName: row.student.name, date,
          sessionId: cell.sessionId, slotId: cell.slotId, isMakeup: cell.isMakeup,
        };
        SLP.ui.render();
      },
    }, ...makeupGlyph(cell));
  }

  // Spec glyphs (spec:215): a *held* makeup is the single character `Ⓜ`, and every other
  // makeup state is its own glyph with a superscript M — so a booked-but-unmarked one
  // reads `▫ᴹ`. A uniform superscript would make a held makeup indistinguishable from a
  // held ordinary session at a glance, which is the distinction the column exists for.
  function makeupGlyph(cell) {
    const base = GLYPH[cell.state] || '?';
    if (!cell.isMakeup) return [base];
    if (cell.state === 'present') return ['Ⓜ'];
    return [base, h('sup', { text: 'M' })];
  }

  function legend() {
    return h('p', { class: 'att-legend', id: 'attendance-legend' },
      h('span', { text: '✓ held' }),
      h('span', { text: '✗ absent' }),
      h('span', { text: '– I missed it' }),
      h('span', { text: '∅ cancelled' }),
      h('span', { text: '▫ scheduled, unmarked' }),
      h('span', { text: '· not scheduled' }),
      h('span', { text: 'Ⓜ makeup (held)' }),
      h('span', { text: '▫ᴹ makeup booked, unmarked' }));
  }

  function gridTable(grid, slots) {
    // Two header rows. The day row carries day-of-month alone, which repeats across a
    // quarter ("1" three times); the band above it names the month each run belongs to.
    const monthRow = h('tr', { id: 'attendance-months' },
      h('th', { class: 'att-name', scope: 'col' }),
      monthBand(grid.dates).map(s => h('th', {
        class: 'att-month', scope: 'colgroup', colspan: String(s.count),
        'data-month': s.key, text: s.label })),
      h('th', { class: 'att-pct', scope: 'col' }),
      h('th', { class: 'att-owed', scope: 'col' }));

    const head = h('tr', {},
      h('th', { class: 'att-name', scope: 'col', text: 'Student' }),
      grid.dates.map(d => h('th', { class: 'att-day', scope: 'col',
                                    'data-date': d, text: dayNum(d) })),
      h('th', { class: 'att-pct', scope: 'col', text: '%' }),
      h('th', { class: 'att-owed', scope: 'col', text: 'Owed' }));

    // On her real caseload (49 students) the grid runs well past a screen's height, so
    // neither the popover nor the booking form can live at the end of the section —
    // either would open a thousand pixels below the row she just clicked, off screen,
    // with the scroll position unchanged and nothing visibly happening. Both render
    // immediately after the row they belong to instead, in their own full-width row,
    // still entirely driven by ui.marking / ui.booking: nothing is anchored to a DOM
    // element or held across renders. Opening one already clears the other (the Owed
    // button and cellEl's click handler both do this), so at most one applies to any
    // given row — but the check below still asks "which, if either" rather than
    // assuming, so a row is never asked to show both at once.
    const colspan = String(1 + grid.dates.length + 2);
    const body = grid.rows.flatMap(row => {
      const tr = h('tr', { 'data-student-id': row.student.id },
        h('th', { class: 'att-name', scope: 'row', text: row.student.name }),
        grid.dates.map(d => {
          const cells = row.cells[d] || [];
          // Two sessions in one day render as two boxes rather than one merged
          // verdict — uncommon, but merging would silently hide a miss.
          return h('td', { class: 'att-day', 'data-date': d },
            cells.length ? cells.map(c => cellEl(d, row, c))
                         : h('span', { class: 'att-none', text: '·' }));
        }),
        h('td', { class: 'att-pct' + (pctProvisional(row.pct) ? ' att-pct-provisional' : ''),
                  text: pctText(row.pct) }),
        h('td', { class: 'att-owed' },
          row.owed.owed
            ? h('button', {
                class: 'att-owed-open linkish att-owed-debt', type: 'button',
                text: '−' + row.owed.owed + ' min',
                'aria-label': 'Book a makeup for ' + row.student.name +
                              ', owes ' + row.owed.owed + ' minutes',
                'on:click': async () => {
                  ui.marking = null;
                  ui.booking = { student: row.student, owed: row.owed.owed };
                  await SLP.ui.render();
                },
              })
            : h('span', { text: '—' })));
      if (ui.marking && ui.marking.studentId === row.student.id) {
        return [tr, h('tr', { class: 'att-popover-row' },
          h('td', { colspan }, popover()))];
      }
      if (ui.booking && ui.booking.student.id === row.student.id) {
        return [tr, h('tr', { class: 'att-popover-row', id: 'att-booking-row' },
          h('td', { colspan }, bookingForm(slots)))];
      }
      return [tr];
    });

    return h('div', { class: 'att-wrap' },
      h('table', { class: 'att-grid', id: 'attendance-grid' },
        h('thead', {}, monthRow, head), h('tbody', {}, body)));
  }

  // A slot object is what setAttendance/setSessionAttendance want; the cell may know
  // only a sessionId (an ad-hoc session has no slot at all). Step 4 taught ensureSession
  // to resolve a session by id, so a slotless cell now hands it the same synthetic-slot
  // shape planForDate builds — { id: null, sessionId } — and the store owns the roster
  // walk and stickiness rule exactly as it does for a scheduled session. This used to
  // re-implement both here; now there is one place that knows how a sweep works.
  async function markCell(target, status, wholeSession) {
    const { date, slotId, sessionId, studentId } = target;
    const slot = slotId
      ? (await SLP.store.listSlots()).find(s => s.id === slotId)
      : (sessionId ? { id: null, sessionId } : null);
    // Not reachable today (a stale slotId/sessionId would mean the cell's own slot or
    // session vanished between render and click), but a silent no-op here is the one
    // failure this app exists to prevent: she picks a status, the popover closes, and
    // nothing was written with nothing to tell her so. Toast rather than swallow it.
    if (!slot) { SLP.ui.toast('That mark did not save — reload and try again.', 'warn'); return; }
    if (wholeSession) {
      await SLP.store.setSessionAttendance({ dateStr: date, slot, status });
    } else {
      await SLP.store.setAttendance({ dateStr: date, slot, studentId, status });
    }
  }

  function choice(status, wholeSession) {
    return h('button', {
      class: (wholeSession ? 'att-choice-session' : 'att-choice') + ' plain',
      type: 'button', 'data-status': status,
      text: (wholeSession ? 'Whole session: ' : '') + LABEL[status],
      'on:click': async () => {
        const target = ui.marking;
        ui.marking = null;
        await markCell(target, status, wholeSession);
        await SLP.ui.render();
      },
    });
  }

  // Rendered into the page rather than positioned against the clicked element: every
  // render tears #app down, so an element-anchored popover would have nothing to
  // anchor to on the way back. The route through state is the same one the Today
  // card's expansion takes.
  function popover() {
    if (!ui.marking) return null;
    return h('div', { class: 'att-popover panel', id: 'att-popover',
                      'data-student-id': ui.marking.studentId,
                      'data-date': ui.marking.date, role: 'dialog',
                      'aria-label': 'Mark ' + ui.marking.studentName + ' on ' + ui.marking.date },
      h('h3', { text: ui.marking.studentName + ' · ' + ui.marking.date }),
      h('div', { class: 'att-choices' },
        SLP.model.ATTENDANCE_STATUSES.map(s => choice(s, false)),
        h('hr', {}),
        // One reason to mark a whole session at once, and it is the honest one:
        // a closure or a day she was out is not a per-child fact.
        choice('missed', true),
        choice('cancelled', true)),
      h('button', { class: 'linkish', id: 'att-popover-close', type: 'button', text: 'Cancel',
                    'on:click': async () => { ui.marking = null; await SLP.ui.render(); } }),
      ui.marking.isMakeup && ui.marking.sessionId
        ? h('div', {},
            h('hr', {}),
            ui.armedDelete === ui.marking.sessionId
              ? h('div', {},
                  h('p', { class: 'muted', text: 'Delete this booked makeup?' }),
                  h('button', {
                    class: 'danger', id: 'att-delete-makeup-confirm', type: 'button',
                    text: 'Delete it',
                    'on:click': async () => {
                      const id = ui.marking.sessionId;
                      ui.marking = null; ui.armedDelete = null;
                      await SLP.store.deleteMakeup(id);
                      await SLP.ui.render();
                    },
                  }),
                  h('button', { class: 'linkish', type: 'button', text: 'Keep it',
                                'on:click': async () => { ui.armedDelete = null;
                                                          await SLP.ui.render(); } }))
              : h('button', {
                  class: 'linkish', id: 'att-delete-makeup', type: 'button',
                  text: 'Delete this makeup',
                  'on:click': async () => { ui.armedDelete = ui.marking.sessionId;
                                            await SLP.ui.render(); },
                }))
        : null);
  }

  // Nudged to the next weekday so the default is a day she is actually in school.
  function nextWeekday(fromStr) {
    const [y, mo, d] = fromStr.split('-').map(Number);
    const cur = new Date(y, mo - 1, d);
    do { cur.setDate(cur.getDate() + 1); } while (cur.getDay() === 0 || cur.getDay() === 6);
    const p = n => String(n).padStart(2, '0');
    return cur.getFullYear() + '-' + p(cur.getMonth() + 1) + '-' + p(cur.getDate());
  }

  const addMinutes = (time, minutes) => {
    const [hh, mm] = time.split(':').map(Number);
    const total = hh * 60 + mm + minutes;
    const p = n => String(n).padStart(2, '0');
    return p(Math.floor(total / 60) % 24) + ':' + p(total % 60);
  };

  // Her own usual time is the better guess than a number we invented: a makeup at the
  // hour she already sees this child is the one most likely to be free in both their
  // timetables. 11:00 survives only as the fallback for a student with no slot at all.
  // Open question 4 in docs/OPEN-QUESTIONS.md — she may well fit makeups into a specific
  // free period instead, in which case this becomes a fixed time again.
  function usualStart(slots, studentId) {
    const mine = (slots || [])
      .filter(s => (s.studentIds || []).includes(studentId) && s.startTime)
      .map(s => s.startTime)
      .sort();
    return mine[0] || '11:00';
  }

  function bookingForm(slots) {
    if (!ui.booking) return null;
    const { student, owed } = ui.booking;
    const minutes = SLP.derive.makeupDuration(owed, slots, student.id);
    const start = usualStart(slots, student.id);

    const date = h('input', { type: 'date', id: 'att-book-date',
                              value: nextWeekday(SLP.ui.todayStr()) });
    const from = h('input', { type: 'time', id: 'att-book-start', value: start });
    const to = h('input', { type: 'time', id: 'att-book-end',
                            value: addMinutes(start, minutes) });
    const where = h('input', { type: 'text', id: 'att-book-where', placeholder: 'Where' });

    return h('section', { class: 'panel', id: 'att-booking' },
      h('h2', { text: 'Book a makeup · ' + student.name }),
      h('p', { class: 'muted', text: 'owes ' + owed + ' min' }),
      h('div', { class: 'row-form' },
        'Date', date, 'Time', from, '–', to, 'Where', where,
        h('button', {
          class: 'primary', id: 'att-book-save', type: 'button', text: 'Book it',
          'on:click': async () => {
            if (!date.value || !from.value || !to.value) {
              SLP.ui.toast('A makeup needs a date and a time.', 'warn'); return;
            }
            if (SLP.derive.minutesOf({ startTime: from.value, endTime: to.value }) <= 0) {
              // Word for word what the schedule form says at index.html:1302. The same
              // mistake must not get two different sentences in one app.
              SLP.ui.toast('The end time must be after the start.', 'warn'); return;
            }
            await SLP.store.bookMakeup({
              date: date.value, startTime: from.value, endTime: to.value,
              location: where.value.trim(), studentId: student.id });
            ui.booking = null;
            await SLP.ui.render();
          },
        }),
        h('button', { class: 'linkish', id: 'att-book-cancel', type: 'button', text: 'Cancel',
                      'on:click': async () => { ui.booking = null; await SLP.ui.render(); } })));
  }

  SLP.ui.views.attendance = async (root) => {
    // One control, two jobs: left at its default she marks the current month and
    // scrolls a little; set to a quarter at progress-note time she does not scroll
    // at all. Her Q1-versus-Q1-plus-Q2 split is two ranges on this one screen.
    if (!ui.range) ui.range = SLP.derive.monthRange(SLP.ui.todayStr());

    const from = h('input', { type: 'date', id: 'attendance-from', value: ui.range.from });
    const to = h('input', { type: 'date', id: 'attendance-to', value: ui.range.to });
    from.addEventListener('change', async () => {
      ui.range = { from: from.value, to: ui.range.to };
      await SLP.ui.render();
    });
    to.addEventListener('change', async () => {
      ui.range = { from: ui.range.from, to: to.value };
      await SLP.ui.render();
    });

    // She sets the two ends one at a time, so "end before start" is a normal state on
    // the way from one range to another — the picker stores what she typed and says so,
    // rather than refusing the keystroke and stranding her half-way. eachDate yields
    // nothing for an inverted range, so the grid below is empty rather than wrong.
    const invalidRange = !ui.range.from || !ui.range.to || ui.range.from > ui.range.to;
    if (invalidRange) SLP.ui.toast('The end date must be after the start.', 'warn');

    const data = await SLP.store.attendanceRange({
      from: ui.range.from, to: ui.range.to, today: SLP.ui.todayStr() });

    // The filters take the caseload, not the grid rows, so a school with nobody
    // left in it drops off the list the same way it does on the Students tab.
    const filters = SLP.ui.studentFilters({
      idPrefix: 'attendance', state: ui, students: data.students,
      // A filter that hides the student whose popover or booking form is open leaves
      // ui.marking/ui.booking pointing at a row no longer on screen — harmless (no
      // wrong write is reachable from it) but untidy, and it lingers until another
      // cell or Owed button is clicked.
      onChange: () => { ui.marking = null; ui.booking = null; SLP.ui.render(); },
    });
    const shown = new Set(filters.shown.map(s => s.id));

    const grid = SLP.derive.attendanceGrid(data);
    grid.rows = grid.rows.filter(r => shown.has(r.student.id));

    root.appendChild(h('section', { class: 'panel' },
      h('h2', { text: 'Attendance' }),
      h('div', { class: 'row-form' }, 'From', from, 'to', to),
      filters.el,
      invalidRange
        ? h('p', { class: 'empty', id: 'attendance-range-error',
                   text: 'The end date must be after the start.' })
        : grid.rows.length
          ? gridTable(grid, data.slots)
          : h('p', { class: 'empty', text: 'No students match.' }),
      legend()));
  };

  // The student page has its own range: she is writing one child's progress note and
  // may want a different window from whatever the grid is showing. Same arithmetic,
  // same pure function — the two can disagree about the range, never about the number.
  const detail = { range: null };

  SLP.ui.students.renderAttendance = async (container, student) => {
    if (!detail.range) detail.range = SLP.derive.monthRange(SLP.ui.todayStr());

    const from = h('input', { type: 'date', id: 'student-attendance-from',
                              value: detail.range.from });
    const to = h('input', { type: 'date', id: 'student-attendance-to',
                            value: detail.range.to });
    from.addEventListener('change', async () => {
      detail.range = { from: from.value, to: detail.range.to };
      await SLP.ui.render();
    });
    to.addEventListener('change', async () => {
      detail.range = { from: detail.range.from, to: to.value };
      await SLP.ui.render();
    });

    // The same guard the grid carries, in the panel's own register. She sets the two ends
    // one at a time, so a half-picked range is a normal state on the way through — and a
    // range with no days now yields no number at all, which without this reads as a child
    // who has no sessions rather than as two dates she has not finished typing.
    const invalidRange = !detail.range.from || !detail.range.to ||
                         detail.range.from > detail.range.to;

    const data = await SLP.store.attendanceRange({
      from: detail.range.from, to: detail.range.to, today: SLP.ui.todayStr() });
    const grid = SLP.derive.attendanceGrid(data);
    const row = grid.rows.find(r => r.student.id === student.id);
    const pct = row ? row.pct : { pct: null, heldSessions: 0, offeredSessions: 0, uncharted: 0 };
    const owed = row ? row.owed.owed : 0;

    container.appendChild(h('section', { class: 'panel', id: 'student-attendance' },
      h('h2', { text: 'Attendance' }),
      h('div', { class: 'row-form' }, 'From', from, 'to', to),
      invalidRange
        ? h('p', { class: 'empty', id: 'student-attendance-range-error',
                   text: 'The end date must be after the start.' })
        : [h('p', { id: 'student-attendance-pct', text: pctText(pct),
                    class: pctProvisional(pct) ? 'att-pct-provisional' : '' }),
           h('p', { id: 'student-attendance-owed', class: 'muted',
                    text: owed ? 'Makeup owed: ' + owed + ' min' : 'No makeup owed.' })]));
  };
})();

// ============================================================
// SECTION: ui.aggregation — history, per-objective charts, mastery.
// Each objective owns its chart and its scale. Never compare across objectives.
// ============================================================
(() => {
  const { h } = SLP.ui;
  const m = SLP.model;
  const SVG = 'http://www.w3.org/2000/svg';
  const filter = { from: '', to: '' };

  const svgEl = (tag, attrs) => {
    const el = document.createElementNS(SVG, tag);
    for (const [k, v] of Object.entries(attrs || {})) el.setAttribute(k, v);
    return el;
  };
  const prettyDate = ds => {
    const [y, mo, d] = ds.split('-').map(Number);
    return new Date(y, mo - 1, d).toLocaleDateString(undefined,
      { month: 'long', day: 'numeric', year: 'numeric' });
  };

  function chart(series) {
    const pts = series.points;
    const W = 520, H = 150, PAD_L = 34, PAD_B = 22, PAD_T = 10, PAD_R = 10;
    const svg = svgEl('svg', { viewBox: '0 0 ' + W + ' ' + H, role: 'img',
                               'aria-label': series.label + ' over time' });

    const isPct = series.kind === 'pct';
    const values = pts.map(p => p.value);
    // Scores genuinely exceed criterion — five trials against a target of four is 125% —
    // and a fixed 100 ceiling computed a negative y for those, so the SVG clipped them
    // away entirely. Her best session was the one that disappeared. The ceiling rises to
    // fit the data instead, and the criterion line below carries "met the goal".
    // Do not simplify this back to a constant 100: see
    // docs/adr/0003-objective-charts-scale-past-criterion.md.
    const max = isPct ? Math.max(100, ...values) : Math.max(1, ...values);
    const min = isPct ? 0 : Math.min(0, ...values);
    const span = (max - min) || 1;

    const x = i => pts.length === 1
      ? (PAD_L + (W - PAD_L - PAD_R) / 2)                 // one point sits centred
      : PAD_L + (i / (pts.length - 1)) * (W - PAD_L - PAD_R);
    const y = v => PAD_T + (1 - (v - min) / span) * (H - PAD_T - PAD_B);

    svg.appendChild(svgEl('line', { class: 'chart-axis', x1: PAD_L, y1: PAD_T,
                                    x2: PAD_L, y2: H - PAD_B }));
    svg.appendChild(svgEl('line', { class: 'chart-axis', x1: PAD_L, y1: H - PAD_B,
                                    x2: W - PAD_R, y2: H - PAD_B }));
    for (const [v, label] of [[max, isPct ? max + '%' : String(max)], [min, isPct ? '0%' : String(min)]]) {
      const t = svgEl('text', { class: 'chart-tick', x: 4, y: y(v) + 3 });
      t.textContent = label;
      svg.appendChild(t);
    }

    // "At the top means she met the goal" stopped being true the moment the ceiling
    // could move, so the goal gets its own fixed line. It is the one thing on this
    // chart that does not shift between two viewings of the same objective.
    if (isPct) {
      svg.appendChild(svgEl('line', { class: 'chart-criterion', x1: PAD_L, y1: y(100),
                                      x2: W - PAD_R, y2: y(100) }));
    }

    if (pts.length > 1) {
      svg.appendChild(svgEl('polyline', {
        class: 'chart-line',
        points: pts.map((p, i) => x(i) + ',' + y(p.value)).join(' '),
      }));
    }
    pts.forEach((p, i) => {
      const c = svgEl('circle', { class: 'chart-point', cx: x(i), cy: y(p.value), r: 3.5 });
      c.setAttribute('data-date', p.date);
      c.setAttribute('data-value', String(p.value));
      const title = svgEl('title', {});
      title.textContent = prettyDate(p.date) + ' — ' + (p.label || p.value);
      c.appendChild(title);
      svg.appendChild(c);
    });
    return svg;
  }

  async function objectiveCharts(student, container) {
    const blocks = await SLP.store.objectivesForStudent(student.id);
    for (const { objectives } of blocks) {
      for (const objective of objectives) {
        const rows = await SLP.store.rowsForObjective(student.id, objective.id);
        const box = h('div', { class: 'objective-chart', 'data-objective-id': objective.id },
          h('p', { class: 'objective-text clamp',
                   text: m.displayText(objective.text, student.name),
                   'on:click': e => e.currentTarget.classList.toggle('open') }));

        const allSeries = SLP.derive.series(objective, rows)
          .filter(s => s.points.length);
        if (!allSeries.length) {
          box.appendChild(h('p', { class: 'muted', text: 'No data yet.' }));
        } else {
          for (const s of allSeries) {
            box.appendChild(h('p', { class: 'muted', text: s.label }));
            box.appendChild(chart(s));
          }
          const mast = SLP.derive.mastery(objective, rows);
          if (mast) {
            box.appendChild(h('p', {
              class: 'mastery' + (mast.mastered ? ' met' : ''),
              text: mast.mastered
                ? 'Criterion met in all ' + mast.of + ' of the last ' + mast.of + ' sessions.'
                : 'Met criterion in ' + mast.met + ' of ' + mast.of + ' recent sessions.',
            }));
          }
        }
        container.appendChild(box);
      }
    }
  }

  async function historySection(student) {
    const rows = await SLP.store.historyFor(student.id,
      { from: filter.from || null, to: filter.to || null });

    const objectives = {};
    for (const { objectives: os } of await SLP.store.objectivesForStudent(student.id)) {
      for (const o of os) objectives[o.id] = o;
    }

    const from = h('input', { type: 'date', id: 'history-from', value: filter.from });
    const to = h('input', { type: 'date', id: 'history-to', value: filter.to });
    from.addEventListener('change', async () => { filter.from = from.value; await SLP.ui.render(); });
    to.addEventListener('change', async () => { filter.to = to.value; await SLP.ui.render(); });

    const list = h('div', { id: 'session-history' });
    if (!rows.length) list.appendChild(h('p', { class: 'muted', text: 'No sessions in this range.' }));

    for (const row of rows) {
      const summary = row.datapoints.map(dp => {
        const o = objectives[dp.objectiveId];
        if (!o) return null;
        const r = m.ratio(o, dp);
        if (r) return o.fields.find(f => f.role === 'achieved').label +
                      ' ' + r.achieved + '/' + r.target + ' (' + r.pct + '%)';
        return o.fields.filter(f => dp.values[f.id] && dp.values[f.id].entered)
          .map(f => f.label + ' ' + dp.values[f.id].value).join(', ');
      }).filter(Boolean).join(' · ');

      list.appendChild(h('div', { class: 'history-row' },
        h('div', {},
          h('span', { class: 'history-date',
                      text: prettyDate(row.session.date) + ' · ' + row.session.startTime }),
          ' ',
          h('span', { class: 'state-chip',
                      'data-state': (row.attendance && row.attendance.status) || 'none',
                      text: (row.attendance && row.attendance.status) || 'not charted' })),
        summary ? h('div', { class: 'history-data', text: summary }) : null,
        row.note && row.note.text ? h('p', { class: 'history-note', text: row.note.text }) : null));
    }

    return h('section', { class: 'panel' },
      h('h2', { text: 'Session history' }),
      h('div', { class: 'row-form' }, 'From', from, 'to', to,
        h('button', { class: 'plain', type: 'button', text: 'Clear',
                      'on:click': async () => { filter.from = ''; filter.to = '';
                                                await SLP.ui.render(); } })),
      list);
  }

  SLP.ui.students.renderAggregation = async (container, student) => {
    const progress = h('section', { class: 'panel', id: 'progress' },
      h('h2', { text: 'Progress' }));
    await objectiveCharts(student, progress);
    container.appendChild(progress);
    container.appendChild(await historySection(student));
  };

  SLP.ui.chart = chart;
})();

// ============================================================
// SECTION: ui.backup — the nag and the buttons.
// persist() was DENIED: "Clear browsing data" wipes everything.
// This bar is the only thing standing between her and a lost year.
// ============================================================
(() => {
  const { h, toast } = SLP.ui;
  const STALE_AFTER_DAYS = 3;
  const PHRASE = 'REPLACE EVERYTHING';
  // A different word for a different act. She is not replacing anything here, and typing
  // a phrase that misdescribes what is about to happen is worse than typing nothing.
  const CLEAR_PHRASE = 'DELETE EVERYTHING';

  // render() rebuilds the DOM, so anything the bar remembers between renders has to
  // live out here — the same reason ui.aggregation keeps its date filter at module level.
  const ui = {
    moreOpen: false,        // the rarely-used controls: linking, changing, restoring
    pending: null,          // a parsed backup she has been shown but not yet agreed to
    clearing: null,         // a start-fresh she has been shown but not yet agreed to
    typed: '',              // what she has typed into the confirmation box so far
  };

  async function backupNow() {
    try {
      const { via } = await SLP.backup.backupNow();
      toast(via === 'handle' ? 'Backed up to your linked file.' : 'Backup downloaded.', 'ok');
    } catch (e) {
      toast('Backup failed — ' + e.message, 'error');
    }
    await SLP.ui.render();
  }

  // Reading a file is not agreeing to it. This stages what the file holds and what
  // replacing it would cost her, then hands the decision back. Nothing is written here.
  async function restoreFromFile(file) {
    if (!file) return;
    try {
      const text = await file.text();
      const staged = SLP.backup.parseBackup(text);
      ui.pending = {
        staged,
        fileName: file.name || 'that file',
        current: {
          students: (await SLP.db.getAll('students')).length,
          sessions: (await SLP.db.getAll('sessions')).length,
        },
        status: await SLP.backup.status(),
      };
      ui.typed = '';
    } catch (e) {
      ui.pending = null;
      toast(e.message, 'error');
    }
    await SLP.ui.render();
  }

  // How much friction the replacement deserves, measured by what she would actually
  // lose: nothing at all, a copy that is safely on disk, or the only copy there is.
  // Shared by restore and start fresh, because the question is the same one — what is on
  // disk — and it would be a bad joke if the two screens disagreed about whether she is safe.
  function riskOf(current, status) {
    if (current.students === 0) return 'none';
    const safe = status.lastBackupAt !== null && status.staleDays < STALE_AFTER_DAYS;
    return safe ? 'copied' : 'only-copy';
  }
  const atRisk = () => ui.pending ? riskOf(ui.pending.current, ui.pending.status) : 'none';
  const clearRisk = () => ui.clearing ? riskOf(ui.clearing.current, ui.clearing.status) : 'none';
  const mayReplace = () => atRisk() !== 'only-copy' || ui.typed.trim() === PHRASE;
  const mayClear = () => clearRisk() !== 'only-copy' || ui.typed.trim() === CLEAR_PHRASE;

  async function confirmRestore() {
    if (!ui.pending || !mayReplace()) return;
    const staged = ui.pending.staged;
    ui.pending = null;
    ui.typed = '';
    try {
      const { restored } = await SLP.backup.applyBackup(staged);
      const n = Object.values(restored).reduce((a, b) => a + b, 0);
      toast('Restored ' + n + ' records.', 'ok');
    } catch (e) {
      toast(e.message, 'error');
    }
    await SLP.ui.render();
  }

  async function cancelRestore() {
    ui.pending = null;
    ui.typed = '';
    await SLP.ui.render();
  }

  // Same shape as staging a restore: count what is at stake while it is all still there,
  // then hand the decision back. A pending restore stands down — two confirmations
  // stacked in the same place is exactly where a mis-click does the unrecoverable thing.
  async function askStartFresh() {
    ui.pending = null;
    ui.typed = '';
    ui.clearing = {
      current: {
        students: (await SLP.db.getAll('students')).length,
        sessions: (await SLP.db.getAll('sessions')).length,
      },
      status: await SLP.backup.status(),
    };
    await SLP.ui.render();
  }

  async function confirmStartFresh() {
    if (!ui.clearing || !mayClear()) return;
    ui.clearing = null;
    ui.typed = '';
    try {
      const { cleared } = await SLP.backup.startFresh();
      const n = Object.values(cleared).reduce((a, b) => a + b, 0);
      toast(n ? 'Cleared ' + n + ' records. The app is empty.' : 'The app was already empty.',
            'ok');
    } catch (e) {
      toast(e.message, 'error');
    }
    // Back to a clean slate rather than whatever student she happened to have open.
    await SLP.ui.go({ tab: 'students', studentId: null });
  }

  async function cancelStartFresh() {
    ui.clearing = null;
    ui.typed = '';
    await SLP.ui.render();
  }

  async function pickFile() {
    try {
      if (!SLP.backup.hasFileApi()) {
        toast('This browser cannot link a backup file. Use Back up now instead.', 'warn');
        return;
      }
      if (await SLP.backup.pickBackupFile()) {
        await SLP.backup.writeToHandle();
        toast('Backup file linked. One press saves to it from now on.', 'ok');
      }
    } catch (e) {
      if (e && e.name === 'AbortError') return;      // she closed the picker; not an error
      toast('Could not link that file — ' + e.message, 'error');
    }
    await SLP.ui.render();
  }

  async function bar() {
    const status = await SLP.backup.status();
    const hasData = (await SLP.db.getAll('students')).length > 0;

    const fileInput = h('input', { type: 'file', id: 'backup-restore-input',
                                   accept: '.json,application/json',
                                   style: 'display:none' });
    fileInput.addEventListener('change', async () => {
      await restoreFromFile(fileInput.files && fileInput.files[0]);
    });

    const when = status.lastBackupAt ? 'saved ' + status.since : 'never backed up';

    // Everyday state names the file she is trusting; before setup, the status line
    // carries the invitation rather than putting a second button beside the first.
    const statusEl = status.hasHandle
      ? h('span', { id: 'backup-status',
                    text: 'Saving to ' + (status.fileName || 'your backup file') + ' · ' + when })
      : h('span', { id: 'backup-status' },
          h('span', { text: 'Backups are not saving to a file yet — ' }),
          h('button', { class: 'linklike', id: 'backup-setup', type: 'button',
                        text: 'choose where to save them…', 'on:click': pickFile }));

    // Back up now stays visible in both states: it is the only control that works
    // everywhere, including a browser with no File System Access API.
    const row = h('div', { class: 'backup-bar-inner', id: 'backup-bar' },
      h('button', { class: 'primary', id: 'backup-now', type: 'button', text: 'Back up now',
                    'on:click': backupNow }),
      statusEl,
      h('button', { class: 'linklike', id: 'backup-more', type: 'button',
                    'aria-expanded': String(ui.moreOpen),
                    text: ui.moreOpen ? 'Less ▴' : 'More ▾',
                    'on:click': async () => { ui.moreOpen = !ui.moreOpen; await SLP.ui.render(); } }),
      fileInput);

    // Linking once and restoring after a disaster are not daily work, so they stay out
    // of the way — and out of the tab order — until she asks for them.
    const more = ui.moreOpen ? h('div', { id: 'backup-more-panel' },
      h('button', { class: 'plain', id: 'backup-pick', type: 'button',
                    text: status.hasHandle ? 'Change where backups save…'
                                           : 'Choose where to save backups…',
                    'on:click': pickFile }),
      h('button', { class: 'plain', id: 'backup-restore', type: 'button',
                    text: 'Restore from a backup…', 'on:click': () => fileInput.click() }),
      h('button', { class: 'plain danger-link', id: 'start-fresh', type: 'button',
                    text: 'Start fresh…', 'on:click': askStartFresh }),
      h('span', { class: 'muted',
                  text: 'Restoring replaces everything on this laptop; ' +
                        'starting fresh empties it.' })) : null;

    const els = [row];
    if (more) els.push(more);
    if (ui.pending) els.push(confirmPanel());
    if (ui.clearing) els.push(clearPanel());

    const stale = status.lastBackupAt === null || status.staleDays >= STALE_AFTER_DAYS;
    if (hasData && stale) {
      els.unshift(h('div', { id: 'backup-nag' },
        status.lastBackupAt === null
          ? 'Your work has never been backed up. It is saved on this laptop only, and ' +
            'Chrome can erase it without warning — press Back up now.'
          : 'Last backup was ' + status.staleDays + ' days ago. Press Back up now.'));
    }
    return els;
  }

  const count = (n, word) => n + ' ' + word + (n === 1 ? '' : 's');

  // Both sides of the trade, in her units, before anything is replaced. Seeing
  // "12 students" against her own 49 is what catches the wrong file.
  function confirmPanel() {
    const p = ui.pending;
    const risk = atRisk();
    const rows = [
      h('p', { class: 'confirm-title', text: 'Replace everything with this backup?' }),
      h('p', { class: 'confirm-line',
               text: 'On this laptop now: ' + count(p.current.students, 'student') +
                     ', ' + count(p.current.sessions, 'session') }),
      h('p', { class: 'confirm-line',
               text: 'In ' + p.fileName + ': ' + count(p.staged.counts.students, 'student') +
                     ', ' + count(p.staged.counts.sessions, 'session') }),
    ];

    if (risk === 'none') {
      rows.push(h('p', { class: 'confirm-note',
                         text: 'There is nothing on this laptop to lose.' }));
    } else if (risk === 'copied') {
      rows.push(h('p', { class: 'confirm-note',
                         text: 'Your current work is backed up to ' +
                               (p.status.fileName || 'your backup file') +
                               ', so you could get it back.' }));
    }

    const go = h('button', { class: 'danger', id: 'restore-confirm-go', type: 'button',
                             text: 'Replace everything', 'on:click': confirmRestore });

    if (risk === 'only-copy') {
      rows.push(h('p', { class: 'confirm-warn',
                         text: 'Your current work has never been backed up. Replacing it ' +
